// 홈
// ============================================================
function renderSeminarCarousel(seminars) {
  const wrap = document.getElementById('home-seminar-carousel');
  const track = document.getElementById('seminar-carousel-track');
  const dotsWrap = document.getElementById('seminar-carousel-dots');
  if (!wrap || !track) return;

  if (!seminars || seminars.length === 0) {
    wrap.style.display = 'none';
    return;
  }

  const renderItem = (s) => {
    const dateInfo = [
      s.date ? formatDate(s.date) : '',
      s.time ? s.time : ''
    ].filter(Boolean).join(' · ');
    const visual = s.imageUrl
      ? `<div class="seminar-carousel-imgwrap"><img class="seminar-carousel-img" src="${escapeHtml(s.imageUrl)}" alt="" loading="lazy"></div>`
      : `<div class="seminar-carousel-noimg">${escapeHtml(s.title)}</div>`;
    return `
      <div class="seminar-carousel-item" role="button" tabindex="0" onclick="navigate('seminar-detail', { id: '${s.id}' })">
        ${visual}
        <div class="seminar-carousel-info">
          <div class="seminar-carousel-title">${escapeHtml(s.title)}</div>
          <div class="seminar-carousel-meta">${dateInfo || '\u00A0'}</div>
        </div>
      </div>
    `;
  };

  track.innerHTML = seminars.map(renderItem).join('');

  // 페이지 인디케이터 - 카드가 2개 이상일 때만
  if (dotsWrap) {
    if (seminars.length > 1) {
      dotsWrap.innerHTML = seminars
        .map((_, i) => `<span class="seminar-carousel-dot${i === 0 ? ' active' : ''}"></span>`)
        .join('');
      dotsWrap.style.display = 'flex';
      let ticking = false;
      track.onscroll = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          const items = track.children;
          if (items.length > 0) {
            const step = items[0].offsetWidth + 11;
            const idx = Math.min(
              seminars.length - 1,
              Math.max(0, Math.round(track.scrollLeft / step))
            );
            [...dotsWrap.children].forEach((d, i) => d.classList.toggle('active', i === idx));
          }
          ticking = false;
        });
      };
    } else {
      dotsWrap.innerHTML = '';
      dotsWrap.style.display = 'none';
    }
  }

  wrap.style.display = 'block';
  fitTextsSoon(track);
}

async function loadHome() {
  let data, schedule, colors, settings, courses, seminars, matCats, classrooms, banners;

  try {
    [data, schedule, colors, settings, courses, seminars, matCats, classrooms, banners] = await Promise.all([
      window.api.call('getHome'),
      window.api.call('getSchedule'),
      window.api.call('getScheduleColors'),
      window.api.call('getSettings'),
      window.api.call('getCourses').catch(() => []),
      window.api.call('getSeminars').catch(() => []),
      window.api.call('getMaterialCategories').catch(() => []),
      window.api.call('getClassrooms').catch(() => []),
      window.api.call('getBanners').catch(() => [])
    ]);
  } catch (e) {
    data = { posts: [], schedule: [], settings: {} };
    schedule = []; colors = []; settings = {}; courses = []; seminars = []; matCats = []; classrooms = []; banners = [];
  }

  state.cal.colors = colors || [];

  // 이벤트 배너
  renderBanners(buildBanners({
    banners: banners || [],
    posts: data.posts || [],
    seminars: seminars || []
  }));

  // 세미나 캐러셀
  renderSeminarCarousel(seminars || []);
  
  // ===== 홈 메뉴 카드 미리보기 =====
  renderHomeMenuPreviews({
    courses: courses || [],
    matCats: matCats || [],
    classrooms: classrooms || [],
    seminars: seminars || []
  });

  // 안내사항 - 길면 두 줄만 보이고 펼치기 버튼을 붙인다
  const notice = (settings && settings.notice) ? settings.notice.trim() : '';
  const noticeBar = document.getElementById('notice-bar');
  const noticeText = document.getElementById('notice-text');
  const noticeToggle = document.getElementById('notice-toggle');
  if (notice) {
    noticeBar.style.display = 'flex';
    noticeText.innerHTML = escapeHtml(notice).replace(/\n/g, '<br>');
    noticeText.classList.add('clamped');
    noticeToggle.classList.remove('open');
    noticeToggle.style.display = 'none';
    // 실제로 잘렸을 때만 버튼을 노출한다
    requestAnimationFrame(() => {
      const overflowing = noticeText.scrollHeight > noticeText.clientHeight + 2;
      noticeToggle.style.display = overflowing ? 'inline-flex' : 'none';
      if (!overflowing) noticeText.classList.remove('clamped');
      else noticeToggle.querySelector('span').textContent = '더보기';
    });
  } else {
    noticeBar.style.display = 'none';
  }

  // ===== 히어로 (오늘 + 과정 진행률 + 통계) =====
  const days = ['일','월','화','수','목','금','토'];
  const heroDate = `${TODAY.getMonth() + 1}월 ${TODAY.getDate()}일`;
  const heroDay = `${days[TODAY.getDay()]}요일`;

  const todayStr = `${TODAY.getFullYear()}-${String(TODAY.getMonth() + 1).padStart(2, '0')}-${String(TODAY.getDate()).padStart(2, '0')}`;
  const activeCourses = (courses || []).filter(c => c.active && c.startDate && c.endDate);

  // 우선순위: 진행 중(종강 가까운 순) > 시작 예정(시작 가까운 순) > 종강한 것 중 최근
  const inProgress = activeCourses.filter(c => c.startDate <= todayStr && c.endDate >= todayStr);
  inProgress.sort((a, b) => a.endDate.localeCompare(b.endDate));
  const upcomingCourses = activeCourses.filter(c => c.startDate > todayStr);
  upcomingCourses.sort((a, b) => a.startDate.localeCompare(b.startDate));
  const past = activeCourses.filter(c => c.endDate < todayStr);
  past.sort((a, b) => b.endDate.localeCompare(a.endDate));

  const targetCourse = inProgress[0] || upcomingCourses[0] || past[0];
  const progress = targetCourse
    ? window.computeCourseProgress(targetCourse, schedule || [], colors || [])
    : null;
  const newPostCount = (data.posts || []).filter(p => isNew(p.date) && !isRead(p.id)).length;

  const heroTop = (ddayHtml) => `
    <div class="hero-top">
      <div class="hero-datewrap">
        <div class="hero-date">${heroDate}</div>
        <div class="hero-day">${heroDay}</div>
      </div>
      ${ddayHtml}
    </div>`;

  const heroEl = document.getElementById('hero-area');

  if (progress && targetCourse) {
    const ddayNum = parseInt((progress.dDay.match(/-?\d+/) || ['0'])[0]);
    const urgent = !(progress.dDay.startsWith('D-') && progress.dDay !== 'D-DAY' && ddayNum > 7);

    let stateLabel = '';
    if (targetCourse.startDate > todayStr) stateLabel = ' · 시작 예정';
    else if (targetCourse.endDate < todayStr) stateLabel = ' · 종강';

    heroEl.innerHTML = `
      <section class="hero">
        ${heroTop(`<div class="hero-dday ${urgent ? 'urgent' : ''}">${progress.dDay}</div>`)}
        <div class="hero-course">
          <div class="hero-course-name">${escapeHtml(targetCourse.name)}<span class="hero-course-state">${stateLabel}</span></div>
          <div class="hero-bar"><div class="hero-fill" style="width: ${progress.percent}%;"></div></div>
          <div class="hero-meta">
            <span>${formatDate(targetCourse.startDate)} 시작</span>
            <span><b>${progress.completedSessions}</b> / ${progress.totalSessions}회차</span>
            <span>${formatDate(targetCourse.endDate)} 종강</span>
          </div>
        </div>
        <div class="hero-stats">
          <div class="hero-stat">
            <div class="hero-stat-num">${progress.cancelDays}<small>일</small></div>
            <div class="hero-stat-label">과정 휴강일</div>
          </div>
          <div class="hero-stat">
            <div class="hero-stat-num">${newPostCount}<small>건</small></div>
            <div class="hero-stat-label">읽지 않은 공지</div>
          </div>
        </div>
      </section>
    `;
  } else if (targetCourse) {
    // 과정은 있으나 회차 계산이 불가한 경우
    const ddayObj = new Date(targetCourse.endDate);
    ddayObj.setHours(0, 0, 0, 0);
    const diff = Math.round((ddayObj - TODAY) / (1000 * 60 * 60 * 24));
    const dDay = diff > 0 ? `D-${diff}` : (diff === 0 ? 'D-DAY' : `D+${Math.abs(diff)}`);

    heroEl.innerHTML = `
      <section class="hero">
        ${heroTop(`<div class="hero-dday ${diff <= 7 ? 'urgent' : ''}">${dDay}</div>`)}
        <div class="hero-course">
          <div class="hero-course-name">${escapeHtml(targetCourse.name)}</div>
          <div class="hero-meta" style="margin-top: 10px;">
            <span>${formatDate(targetCourse.startDate)} 시작</span>
            <span>${formatDate(targetCourse.endDate)} 종강</span>
          </div>
        </div>
      </section>
    `;
  } else {
    heroEl.innerHTML = `
      <section class="hero hero-plain">
        ${heroTop(newPostCount > 0 ? `<div class="hero-dday">새 공지 ${newPostCount}</div>` : '')}
      </section>
    `;
  }

  // 다가오는 일정
  const upcoming = (data.schedule || []).slice(0, 3);
  document.getElementById('upcoming-count').textContent = upcoming.length > 0 ? `${upcoming.length}건` : '';
  document.getElementById('home-schedule').innerHTML = upcoming.length === 0
    ? `<div class="empty">다가오는 일정이 없습니다</div>`
    : `<div class="card-list">${upcoming.map(renderEventRow).join('')}</div>`;

  // 최신 공지
  const posts = (data.posts || []).slice(0, 3);
  document.getElementById('home-post-count').textContent = newPostCount > 0 ? `새 글 ${newPostCount}` : '';
  document.getElementById('home-posts').innerHTML = posts.length === 0
    ? `<div class="empty">아직 공지가 없습니다</div>`
    : `<div class="card-list">${posts.map(renderPostRow).join('')}</div>`;

  fitTextsSoon(document.getElementById('home-schedule'));
  fitTextsSoon(document.getElementById('home-posts'));

  const hasUnread = posts.some(p => isNew(p.date) && !isRead(p.id));
  document.getElementById('bell-dot').style.display = hasUnread ? 'block' : 'none';
  document.getElementById('tab-badge').style.display = hasUnread ? 'block' : 'none';
}

function renderEventRow(s) {
  const dday = getDday(s.date);
  const d = new Date(s.date);
  d.setHours(0, 0, 0, 0);
  const diff = Math.round((d - TODAY) / (1000 * 60 * 60 * 24));
  const ddayClass = diff <= 3 && diff >= 0 ? 'urgent' : '';
  const todayClass = diff === 0 ? 'today' : '';

  const color = getColorById(s.colorId);
  const dotColor = color ? color.color : '#64748b';
  const colorName = color && color.name ? escapeHtml(color.name) : '';

  return `
    <div class="event" role="button" tabindex="0">
      <div class="event-datebox ${todayClass}">
        <div class="event-date">${formatDateShort(s.date)}</div>
        <div class="event-day">${formatDayShort(s.date)}</div>
      </div>
      <div class="event-main">
        <div class="event-title">${escapeHtml(s.title)}</div>
        <div class="event-sub">
          <span class="event-dot" style="background: ${dotColor}"></span>
          <span>${colorName || (diff === 0 ? '오늘' : formatDate(s.date))}</span>
        </div>
      </div>
      <div class="event-dday ${ddayClass}">${dday}</div>
    </div>
  `;
}

function renderPostRow(p) {
  const unread = isNew(p.date) && !isRead(p.id);
  const newBadge = isNew(p.date) ? '<span class="post-new">NEW</span>' : '';
  const readClass = isRead(p.id) ? 'read' : (unread ? 'unread' : '');
  const thumb = p.imageUrl
    ? `<img class="post-thumb" src="${escapeHtml(p.imageUrl)}" alt="" loading="lazy">`
    : '';
  return `
    <div class="post ${readClass}" role="button" tabindex="0" onclick="openPost('${p.id}')">
      <div class="post-body">
        <div class="post-headline">
          <span class="post-tag ${tagClass(p.category)}">${escapeHtml(p.category || '기타')}</span>
          ${newBadge}
        </div>
        <div class="post-title">${escapeHtml(p.title)}</div>
        <div class="post-meta">
          <span>${formatDate(p.date)}</span>
        </div>
      </div>
      ${thumb}
    </div>
  `;
}

function toggleNotice() {
  const text = document.getElementById('notice-text');
  const btn = document.getElementById('notice-toggle');
  const open = text.classList.toggle('clamped') === false;
  btn.classList.toggle('open', open);
  btn.querySelector('span').textContent = open ? '접기' : '더보기';
}

function openPost(id) {
  markRead(id);
  navigate('post-detail', { id });
}

// 공지 목록
// ============================================================
async function loadPosts() {
  const posts = await window.api.call('getPosts');
  state.allPosts = posts;

  const cats = [...new Set(posts.map(p => p.category).filter(Boolean))];
  const bookmarkCount = posts.filter(p => isBookmarked(p.id)).length;

  const chip = (label, count, active) =>
    `<button class="filter-chip ${active ? 'active' : ''}" data-cat="${escapeHtml(label)}" onclick="filterPosts('${label}')">` +
    `${escapeHtml(label)}<span class="filter-chip-count">${count}</span></button>`;

  document.getElementById('post-filters').innerHTML =
    chip('전체', posts.length, true) +
    chip('북마크', bookmarkCount, false) +
    cats.map(c => chip(c, posts.filter(p => p.category === c).length, false)).join('');

  state.postFilter = '전체';
  renderPostsList(posts);
}

function filterPosts(category) {
  document.querySelectorAll('#post-filters .filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.cat === category);
  });
  let filtered;
  if (category === '전체') filtered = state.allPosts;
  else if (category === '북마크') filtered = state.allPosts.filter(p => isBookmarked(p.id));
  else filtered = state.allPosts.filter(p => p.category === category);
  state.postFilter = category;
  renderPostsList(filtered);
}

function renderPostsList(posts) {
  const countEl = document.getElementById('posts-count');
  const label = state.postFilter && state.postFilter !== '전체' ? state.postFilter : '전체 공지';
  if (countEl) countEl.innerHTML = `${escapeHtml(label)} <b>${posts.length}</b>건`;

  const emptyMsg = state.postFilter === '북마크'
    ? '북마크한 공지가 없습니다'
    : '해당 분류의 공지가 없습니다';

  document.getElementById('posts-list').innerHTML = posts.length === 0
    ? `<div class="empty">${emptyMsg}</div>`
    : `<div class="card-list">${posts.map(renderPostRow).join('')}</div>`;

  fitTextsSoon(document.getElementById('posts-list'));
}

// ============================================================
// 캘린더
// ============================================================
async function loadSchedule(courseId) {
  const [schedule, colors, courses] = await Promise.all([
    window.api.call('getSchedule'),
    window.api.call('getScheduleColors'),
    window.api.call('getCourses').catch(() => [])
  ]);
  state.cal.schedule = schedule || [];
  state.cal.colors = colors || [];
  // active=true인 수업일정만 + 시작일 오름차순
  state.cal.courses = (courses || [])
    .filter(c => c.active && c.startDate && c.endDate)
    .sort((a, b) => a.startDate.localeCompare(b.startDate));
  
  if (state.cal.courses.length === 0) {
    state.cal.activeCourse = null;
    state.cal.courseIndex = -1;
    document.getElementById('cal-month-label').textContent = '수업일정 없음';
    document.getElementById('cal-legend').innerHTML = '<div class="empty">등록된 수업일정이 없습니다</div>';
    document.getElementById('cal-days').innerHTML = '';
    document.getElementById('cal-selected-title').innerHTML = '';
    document.getElementById('cal-selected-events').innerHTML = '';
    return;
  }
  
  // 진행 중 > 예정 > 종강 순으로 우선 선택
  const todayStr = `${TODAY.getFullYear()}-${String(TODAY.getMonth() + 1).padStart(2, '0')}-${String(TODAY.getDate()).padStart(2, '0')}`;
  let initialIdx = -1;
  
  // 1) courseId가 지정되면 그 수업일정으로 점프
  if (courseId) {
    initialIdx = state.cal.courses.findIndex(c => c.id === courseId);
  }
  // 2) 없거나 못 찾으면 진행 중 > 예정 > 마지막
  if (initialIdx < 0) {
    const inProgressIdx = state.cal.courses.findIndex(c => c.startDate <= todayStr && c.endDate >= todayStr);
    if (inProgressIdx >= 0) {
      initialIdx = inProgressIdx;
    } else {
      const upcomingIdx = state.cal.courses.findIndex(c => c.startDate > todayStr);
      if (upcomingIdx >= 0) {
        initialIdx = upcomingIdx;
      } else {
        initialIdx = state.cal.courses.length - 1;
      }
    }
  }
  
  state.cal.courseIndex = initialIdx;
  state.cal.activeCourse = state.cal.courses[initialIdx];
  
  // 선택된 날짜
  if (todayStr >= state.cal.activeCourse.startDate && todayStr <= state.cal.activeCourse.endDate) {
    state.cal.selectedDate = todayStr;
  } else {
    state.cal.selectedDate = state.cal.activeCourse.startDate;
  }
  
  renderCalendarLegend();
  renderCalendar();
}

function renderCalendarLegend() {
  const colors = state.cal.colors || [];
  const course = state.cal.activeCourse;
  
  let courseInfoHtml = '';
  if (course) {
    const cancelTypeIds = new Set(
      colors.filter(c => c.type === 'cancel').map(c => c.id)
    );
    const cancelDates = (state.cal.schedule || [])
      .filter(s => 
        s.date >= course.startDate && 
        s.date <= course.endDate && 
        cancelTypeIds.has(s.colorId)
      )
      .map(s => s.date)
      .sort();
    
    let cancelLine = '';
    if (cancelDates.length > 0) {
      const dateLabels = cancelDates.map(d => formatDateShort(d)).join(', ');
      cancelLine = `<div class="cal-course-cancel">휴강 ${cancelDates.length}일 · ${dateLabels}</div>`;
    }
    
    courseInfoHtml = `
      <div class="cal-course-banner">
        <div class="cal-course-name">${escapeHtml(course.name)}</div>
        <div class="cal-course-period">${formatDate(course.startDate)} 개강 · ${formatDate(course.endDate)} 종강</div>
        ${cancelLine}
      </div>
    `;
  }
  
  let legendHtml = '';
  if (colors.length > 0) {
    legendHtml = `
      <div class="cal-legend">
        ${colors.map(c => `
          <div class="cal-legend-item">
            <span class="cal-legend-dot" style="background: ${escapeHtml(c.color)}"></span>
            <span>${escapeHtml(c.name)}</span>
          </div>
        `).join('')}
      </div>
    `;
  }
  
  document.getElementById('cal-legend').innerHTML = courseInfoHtml + legendHtml;
  fitTextsSoon(document.getElementById('cal-legend'));
}

function calPrev() {
  // 이전 수업일정으로 이동
  if (state.cal.courseIndex > 0) {
    state.cal.courseIndex--;
    state.cal.activeCourse = state.cal.courses[state.cal.courseIndex];
    
    // 선택일 재설정
    const todayStr = `${TODAY.getFullYear()}-${String(TODAY.getMonth() + 1).padStart(2, '0')}-${String(TODAY.getDate()).padStart(2, '0')}`;
    if (todayStr >= state.cal.activeCourse.startDate && todayStr <= state.cal.activeCourse.endDate) {
      state.cal.selectedDate = todayStr;
    } else {
      state.cal.selectedDate = state.cal.activeCourse.startDate;
    }
    renderCalendarLegend();
    renderCalendar();
  }
}

function calNext() {
  // 다음 수업일정으로 이동
  if (state.cal.courseIndex < state.cal.courses.length - 1) {
    state.cal.courseIndex++;
    state.cal.activeCourse = state.cal.courses[state.cal.courseIndex];
    
    const todayStr = `${TODAY.getFullYear()}-${String(TODAY.getMonth() + 1).padStart(2, '0')}-${String(TODAY.getDate()).padStart(2, '0')}`;
    if (todayStr >= state.cal.activeCourse.startDate && todayStr <= state.cal.activeCourse.endDate) {
      state.cal.selectedDate = todayStr;
    } else {
      state.cal.selectedDate = state.cal.activeCourse.startDate;
    }
    renderCalendarLegend();
    renderCalendar();
  }
}

function calGoToday() {
  // "오늘" 버튼: 오늘이 포함된 수업일정으로 이동
  const todayStr = `${TODAY.getFullYear()}-${String(TODAY.getMonth() + 1).padStart(2, '0')}-${String(TODAY.getDate()).padStart(2, '0')}`;
  const todayIdx = state.cal.courses.findIndex(c => c.startDate <= todayStr && c.endDate >= todayStr);
  if (todayIdx >= 0) {
    state.cal.courseIndex = todayIdx;
    state.cal.activeCourse = state.cal.courses[todayIdx];
    state.cal.selectedDate = todayStr;
    renderCalendarLegend();
    renderCalendar();
  }
}

function calSelectDate(dateStr) {
  state.cal.selectedDate = dateStr;
  renderCalendar();
}

function renderCalendar() {
  const { selectedDate, schedule, activeCourse, courses, courseIndex } = state.cal;
  if (!activeCourse) return;
  
  // 헤더에 수업일정 이름 + 인덱스 표시
  const totalC = courses.length;
  document.getElementById('cal-month-label').textContent = `${activeCourse.name}${totalC > 1 ? ` (${courseIndex + 1}/${totalC})` : ''}`;
  fitTextsSoon(document.querySelector('.cal-header'));
  
  // 화살표 활성/비활성 (전후 수업일정 있는지)
  const hasPrev = courseIndex > 0;
  const hasNext = courseIndex < totalC - 1;
  const prevBtn = document.querySelector('.cal-nav button[onclick="calPrev()"]');
  const nextBtn = document.querySelector('.cal-nav button[onclick="calNext()"]');
  if (prevBtn) prevBtn.style.opacity = hasPrev ? '1' : '0.3';
  if (nextBtn) nextBtn.style.opacity = hasNext ? '1' : '0.3';
  
  // 시작일 / 종강일 파싱
  const startD = new Date(activeCourse.startDate);
  startD.setHours(0, 0, 0, 0);
  const endD = new Date(activeCourse.endDate);
  endD.setHours(0, 0, 0, 0);
  
  // 시작일 요일 (0=일)
  const startDayOfWeek = startD.getDay();
  
  // 시작일까지의 빈 칸 + 시작일~종강일 + 종강일 이후 빈 칸 (한 줄 채우기)
  const cells = [];
  // 빈 칸 (시작일 요일 전까지)
  for (let i = 0; i < startDayOfWeek; i++) {
    cells.push({ empty: true });
  }
  // 시작일 ~ 종강일
  const cur = new Date(startD);
  while (cur <= endD) {
    cells.push({ date: new Date(cur), empty: false });
    cur.setDate(cur.getDate() + 1);
  }
  // 마지막 줄 채우기 (토요일까지)
  while (cells.length % 7 !== 0) {
    cells.push({ empty: true });
  }
  
  const eventsByDate = {};
  schedule.forEach(s => {
    if (!eventsByDate[s.date]) eventsByDate[s.date] = [];
    eventsByDate[s.date].push(s);
  });
  
  const todayStr = `${TODAY.getFullYear()}-${String(TODAY.getMonth() + 1).padStart(2, '0')}-${String(TODAY.getDate()).padStart(2, '0')}`;
  
  const html = cells.map(cell => {
    if (cell.empty) {
      return `<div class="cal-day cal-day-empty"></div>`;
    }
    
    const date = cell.date;
    const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    const events = eventsByDate[dateStr] || [];
    const isTodayCell = date.toDateString() === TODAY.toDateString();
    const isSelected = dateStr === selectedDate;
    const dayOfWeek = date.getDay();
    const isStart = dateStr === activeCourse.startDate;
    const isEnd = dateStr === activeCourse.endDate;
    const isPast = dateStr < todayStr;
    
    // 휴강 일정이 있는 날은 칸 전체를 물들여 한눈에 띄게 한다
    const hasCancel = events.some(e => {
      const c = getColorById(e.colorId);
      return c && c.type === 'cancel';
    });

    let classes = ['cal-day', 'in-range'];
    if (isTodayCell) classes.push('today');
    if (isSelected) classes.push('selected');
    if (dayOfWeek === 0) classes.push('sun');
    if (dayOfWeek === 6) classes.push('sat');
    if (isStart) classes.push('start-day');
    if (isEnd) classes.push('end-day');
    if (isPast && !isTodayCell) classes.push('past');
    if (hasCancel) classes.push('has-cancel');

    // 점은 3개까지만 찍고 나머지는 +N으로 줄인다
    const MAX_DOTS = 3;
    const shown = events.slice(0, MAX_DOTS);
    const rest = events.length - shown.length;
    const eventDots = shown.map(e => {
      const color = getColorById(e.colorId);
      const bg = color ? color.color : '#64748b';
      return `<span class="cal-event-dot" style="background: ${bg}"></span>`;
    }).join('') + (rest > 0 ? `<span class="cal-event-more">+${rest}</span>` : '');

    // 1일이거나 과정 첫날이면 월을 표시한다
    const showMonth = date.getDate() === 1 || isStart;
    if (showMonth) classes.push('month-start');
    const monthTag = showMonth
      ? `<div class="cal-month-tag">${date.getMonth() + 1}월</div>`
      : '<div class="cal-month-spacer"></div>';

    const label = `${date.getMonth() + 1}월 ${date.getDate()}일${events.length ? `, 일정 ${events.length}건` : ''}`;

    return `
      <div class="${classes.join(' ')}" role="button" tabindex="0" aria-label="${label}" onclick="calSelectDate('${dateStr}')">
        ${monthTag}
        <div class="cal-day-num">${date.getDate()}</div>
        <div class="cal-events">${eventDots}</div>
      </div>
    `;
  }).join('');
  
  document.getElementById('cal-days').innerHTML = html;
  renderSelectedDayEvents();
  fitTextsSoon(document.getElementById('page-schedule'));
}

function renderSelectedDayEvents() {
  const { selectedDate, schedule, activeCourse } = state.cal;
  
  // 수업일정이 있고 selectedDate가 기간 외면 안내만 표시
  if (activeCourse && (selectedDate < activeCourse.startDate || selectedDate > activeCourse.endDate)) {
    document.getElementById('cal-selected-title').innerHTML = '';
    document.getElementById('cal-selected-events').innerHTML = `<div class="empty">수업일정 기간 내 날짜를 선택해주세요</div>`;
    return;
  }
  
  const events = schedule.filter(s => s.date === selectedDate);
  const date = new Date(selectedDate);
  const days = ['일','월','화','수','목','금','토'];
  const isTodaySel = date.toDateString() === TODAY.toDateString();
  
  document.getElementById('cal-selected-title').innerHTML = `
    <span class="cal-selected-title-date">${date.getMonth() + 1}월 ${date.getDate()}일</span>

async function initSearch() {
  if (!state.searchData) {
    const [posts, schedule] = await Promise.all([
      window.api.call('getPosts'),
      window.api.call('getSchedule')
    ]);
    state.searchData = { posts, schedule };
  }
  
  const input = document.getElementById('search-input');
  input.value = '';
  input.focus();
  document.getElementById('search-results').innerHTML = `
    <div class="empty">검색어를 입력하세요</div>
  `;
  
  input.oninput = (e) => {
    const q = e.target.value.trim();
    document.getElementById('search-clear').style.display = q ? 'flex' : 'none';
    runSearch(q);
  };
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-input').focus();
  document.getElementById('search-clear').style.display = 'none';
  runSearch('');
}

function runSearch(q) {
  if (!q) {
    document.getElementById('search-results').innerHTML = `<div class="empty">검색어를 입력하세요</div>`;
    return;
  }
  const ql = q.toLowerCase();
  const { posts, schedule } = state.searchData;
  
  const matchedPosts = posts.filter(p => 
    (p.title || '').toLowerCase().includes(ql) ||
    (p.content || '').toLowerCase().includes(ql) ||
    (p.category || '').toLowerCase().includes(ql)
  );
  const matchedSchedule = schedule.filter(s =>
    (s.title || '').toLowerCase().includes(ql) ||
    (s.description || '').toLowerCase().includes(ql)
  );
  
  const totalCount = matchedPosts.length + matchedSchedule.length;
  if (totalCount === 0) {
    document.getElementById('search-results').innerHTML = `<div class="empty">"${escapeHtml(q)}"에 대한 검색 결과가 없습니다</div>`;
    return;
  }
  
  let html = `<div class="posts-count" style="margin: 2px 2px 12px;">검색 결과 <b>${totalCount}</b>건</div>`;
  if (matchedPosts.length > 0) {
    html += `<div class="section-h" style="padding: 0 2px;"><span class="section-t">공지</span><span class="section-meta">${matchedPosts.length}건</span></div>`;
    html += `<div class="card-list">${matchedPosts.map(p => renderPostRowHighlight(p, q)).join('')}</div>`;
  }
  if (matchedSchedule.length > 0) {
    html += `<div class="section-h" style="padding: 18px 2px 10px;"><span class="section-t">일정</span><span class="section-meta">${matchedSchedule.length}건</span></div>`;
    html += `<div class="card-list">${matchedSchedule.map(renderEventRow).join('')}</div>`;
  }
  document.getElementById('search-results').innerHTML = html;
  fitTextsSoon(document.getElementById('search-results'));
}

function highlightText(text, q) {
  if (!q) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const regex = new RegExp(`(${escapeRegex(q)})`, 'gi');
  return escaped.replace(regex, '<span class="search-highlight">$1</span>');
}

function renderPostRowHighlight(p, q) {
  const unread = isNew(p.date) && !isRead(p.id);
  const newBadge = isNew(p.date) ? '<span class="post-new">NEW</span>' : '';
  const readClass = isRead(p.id) ? 'read' : (unread ? 'unread' : '');
  const thumb = p.imageUrl
    ? `<img class="post-thumb" src="${escapeHtml(p.imageUrl)}" alt="" loading="lazy">`
    : '';
  return `
    <div class="post ${readClass}" role="button" tabindex="0" onclick="openPost('${p.id}')">
      <div class="post-body">
        <div class="post-headline">
          <span class="post-tag ${tagClass(p.category)}">${escapeHtml(p.category || '기타')}</span>
          ${newBadge}
        </div>
        <div class="post-title">${highlightText(p.title, q)}</div>
        <div class="post-meta"><span>${formatDate(p.date)}</span></div>
      </div>
      ${thumb}
    </div>
  `;
}

function toggleClsCard(idx) {

function copyToClipboard(text, btn) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      flashCopyBtn(btn);
    }).catch(() => {
      fallbackCopy(text, btn);
    });
  } else {
    fallbackCopy(text, btn);
  }
}

function fallbackCopy(text, btn) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); flashCopyBtn(btn); } catch(_){}
  document.body.removeChild(ta);
}

function flashCopyBtn(btn) {
  if (!btn) return;
  const original = btn.innerHTML;
  btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  btn.style.background = '#d1fae5';
  btn.style.color = '#0d9488';
  setTimeout(() => {
    btn.innerHTML = original;
    btn.style.background = '';
    btn.style.color = '';
  }, 1200);
}

// ============================================================
// 외부 브라우저 강제 열기 (카톡/인스타 인앱 브라우저 우회)
// ============================================================
function isInAppBrowser() {
  const ua = (navigator.userAgent || '').toLowerCase();
  // 카카오톡 / 라인 / 인스타그램 / 페북 / 네이버앱 등 인앱 브라우저 패턴
  return /kakaotalk|line|instagram|fb_iab|fbav|naver|wv\)|wv;|whale\/|whale\s|daumapps|everytimeapp/i.test(ua);
}

// 인앱 브라우저 종류 식별
function getInAppBrowserType() {
  const ua = (navigator.userAgent || '').toLowerCase();
  if (/kakaotalk/i.test(ua)) return 'kakao';
  if (/line\//i.test(ua)) return 'line';
  if (/instagram/i.test(ua)) return 'instagram';
  if (/fb_iab|fbav/i.test(ua)) return 'facebook';
  if (/naver|whale\/|whale\s/i.test(ua)) return 'naver';
  if (/daumapps/i.test(ua)) return 'daum';
  if (/everytimeapp/i.test(ua)) return 'everytime';
  if (/(android).*(wv\)|wv;)/i.test(ua)) return 'android-webview';
  return null;
}

function isIOS() {
  const ua = navigator.userAgent || '';
  return /iPhone|iPad|iPod/i.test(ua);
}
function isAndroid() {
  return /android/i.test(navigator.userAgent || '');
}

function openExternalBrowser(url) {
  if (!url) return;
  
  // 1순위: 모든 케이스에서 새 창(탭) 시도 — 가장 자연스럽고 현재 화면 유지
  let win = null;
  try {
    win = window.open(url, '_blank', 'noopener,noreferrer');
  } catch (e) {
    win = null;
  }
  
  // 새 창이 정상 열렸으면 끝
  if (win) return;
  
  // 새 창 차단됨 → 인앱 브라우저면 외부 브라우저 강제 호출
  const ua = (navigator.userAgent || '').toLowerCase();
  
  if (/kakaotalk/i.test(ua)) {
    // 카톡 - 외부 브라우저 강제 스킴
    try {
      window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
    } catch (e) {}
    return;
  }
  
  if (/android/i.test(ua) && isInAppBrowser()) {
    // 안드로이드 인앱 - intent 스킴
    try {
      const intentUrl = url.replace(/^https?:\/\//, '');
      const intent = 'intent://' + intentUrl + '#Intent;scheme=https;package=com.android.chrome;end';
      window.location.href = intent;
    } catch (e) {}
    return;
  }
  
  // 최후의 수단: 현재 창에서 이동 (그래도 안 되는 경우만)
  try {
    window.location.href = url;
  } catch (e) {}
}

// ============================================================
// 줌 가이드 - 싱글탭 = 확대 / 더블탭 = 외부 링크
// ============================================================
let zoomGuideClickTimer = null;

function onZoomGuideSingleTap(el) {
  // 더블클릭 가능성 대비 - 250ms 기다린 후 단일클릭 처리
  if (zoomGuideClickTimer) {
    // 이미 첫 클릭이 대기 중이었음 → 이건 더블클릭이니 무시 (dblclick에서 처리)
    return;
  }
  zoomGuideClickTimer = setTimeout(() => {
    // 단일클릭 = 이미지 확대
    const url = el.getAttribute('data-url');
    if (url) openImageModal(url);
    zoomGuideClickTimer = null;
  }, 280);
}

function onZoomGuideDoubleTap(el) {
  // 더블클릭 발생 → 단일클릭 타이머 취소
  if (zoomGuideClickTimer) {
    clearTimeout(zoomGuideClickTimer);
    zoomGuideClickTimer = null;
  }
  const link = el.getAttribute('data-link');
  if (link) {
    openExternalBrowser(link);
  } else {
    // 링크 없으면 그냥 확대
    const url = el.getAttribute('data-url');
    if (url) openImageModal(url);
  }
}

  'file': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'
};
function getCatIconSvg(iconName) {
  return CAT_ICONS[iconName] || CAT_ICONS['file'];
}
async function loadAllCategoriesCache() {
  if (state.matCatsCache) return state.matCatsCache;
  const cats = await window.api.call('getMaterialCategories');
  state.matCatsCache = cats;
  return cats;
}
function findCategory(id) {
  if (!state.matCatsCache) return null;
  return state.matCatsCache.find(c => c.id === id);
}

async function loadMaterials() {
  const cats = await loadAllCategoriesCache();
  const topCats = cats.filter(c => !c.parentId);
  
  if (topCats.length === 0) {
    document.getElementById('materials-categories').innerHTML = `<div class="empty">등록된 수업안내가 없습니다</div>`;
    return;
  }
  
  const items = await Promise.all(topCats.map(async (cat) => {
    const hasChildren = cats.some(c => c.parentId === cat.id);
    let count;
    if (hasChildren) {
      count = cats.filter(c => c.parentId === cat.id).length;
      return { ...cat, count, isParent: true };
    } else {
      const mats = await window.api.call('getMaterials', { categoryId: cat.id });
      return { ...cat, count: mats.length, isParent: false };
    }
  }));
  
  document.getElementById('materials-categories').innerHTML = `
    <div class="material-cat-grid">
      ${items.map(c => `
        <button class="material-cat-card" data-color="${c.color || '6'}" onclick="${c.isParent ? `navigate('materials-sub', {parentId: '${c.id}'})` : `navigate('materials-list', {categoryId: '${c.id}'})`}">
          <div class="material-cat-icon-wrap">
            <svg class="material-cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${getCatIconSvg(c.icon)}</svg>
          </div>
          <div>
            <div class="material-cat-name">${escapeHtml(c.name)}</div>
            <div class="material-cat-meta" style="margin-top: 4px;">${c.isParent ? `${c.count}개 분류` : (c.type === 'book' ? `${c.count}권` : `${c.count}건`)}</div>
          </div>
        </button>
      `).join('')}
    </div>
  `;
}

async function loadMaterialsSub(parentId) {
  const cats = await loadAllCategoriesCache();
  const parent = findCategory(parentId);
  const subs = cats.filter(c => c.parentId === parentId);
  if (!parent) {
    document.getElementById('materials-sub-content').innerHTML = '<div class="empty">카테고리를 찾을 수 없습니다</div>';
    return;
  }
  const subsWithCount = await Promise.all(subs.map(async (sub) => {
    const mats = await window.api.call('getMaterials', { categoryId: sub.id });
    return { ...sub, count: mats.length };
  }));
  document.getElementById('materials-sub-content').innerHTML = `
    <h1 class="detail-title" style="padding-right: 0;">${escapeHtml(parent.name)}</h1>
    <div style="font-size: 12px; color: var(--text-soft); margin-bottom: 18px;">${subs.length}개 분류</div>
    ${subs.length === 0 
      ? '<div class="empty">하위 분류가 없습니다</div>'
      : `<div class="material-cat-grid">
          ${subsWithCount.map(c => `
            <button class="material-cat-card" data-color="${c.color || parent.color || '6'}" onclick="navigate('materials-list', {categoryId: '${c.id}'})">
              <div class="material-cat-icon-wrap">
                <svg class="material-cat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${getCatIconSvg(c.icon || parent.icon)}</svg>
              </div>
              <div>
                <div class="material-cat-name">${escapeHtml(c.name)}</div>
                <div class="material-cat-meta" style="margin-top: 4px;">${c.count}건</div>
              </div>
            </button>
          `).join('')}
        </div>`
    }
  `;
}

async function loadMaterialsList(categoryId) {
  const cats = await loadAllCategoriesCache();
  const cat = findCategory(categoryId);
  if (!cat) {
    document.getElementById('materials-list-content').innerHTML = '<div class="empty">카테고리를 찾을 수 없습니다</div>';
    return;
  }
  const parent = cat.parentId ? findCategory(cat.parentId) : null;
  const materials = await window.api.call('getMaterials', { categoryId });
  const breadcrumb = parent ? `<div class="material-detail-breadcrumb">${escapeHtml(parent.name)} › ${escapeHtml(cat.name)}</div>` : '';
  const isBook = cat.type === 'book';
  
  document.getElementById('materials-list-content').innerHTML = `
    ${breadcrumb}
    <h1 class="detail-title" style="padding-right: 0;">${escapeHtml(cat.name)}</h1>
    <div style="font-size: 12px; color: var(--text-soft); margin-bottom: 18px;">${materials.length}${isBook ? '권' : '건'}</div>
    ${materials.length === 0 
      ? `<div class="empty">${isBook ? '등록된 교재가 없습니다' : '등록된 자료가 없습니다'}</div>`
      : (isBook 
        ? `<div class="book-list">${materials.map(renderBookCard).join('')}</div>`
        : materials.map((m, i) => `
          <div class="material-card" onclick="navigate('materials-detail', {id: '${m.id}'})">
            <div class="material-card-num">${i + 1}</div>
            <div class="material-card-content">
              <div class="material-card-title">${escapeHtml(m.title)}</div>
              ${m.description ? `<div class="material-card-desc">${escapeHtml(m.description)}</div>` : ''}
            </div>
          </div>
        `).join('')
      )
    }
  `;
}

function renderBookCard(m) {
  const link = m.bookLink || '';
  const safeLink = escapeHtml(link);
  const onclickAttr = link
    ? `onclick="openExternalBrowser('${safeLink}')"`
    : `onclick="event.preventDefault()"`;
  const initials = (m.title || '').slice(0, 8);
  const thumbHtml = m.bookImageUrl
    ? `<img src="${escapeHtml(m.bookImageUrl)}" alt="" loading="lazy">`
    : `<div class="book-thumb-noimg">${escapeHtml(initials)}</div>`;
  
  return `
    <div class="book-card" ${onclickAttr}>
      <div class="book-thumb">${thumbHtml}</div>
      <div class="book-body">
        <div>
          <div class="book-title">${escapeHtml(m.title)}</div>
          ${m.bookSub ? `<div class="book-sub">${escapeHtml(m.bookSub)}</div>` : ''}
          ${m.bookPrice ? `<div class="book-price">${escapeHtml(m.bookPrice)}</div>` : ''}
        </div>
        ${link ? `<div class="book-cta">교재몰에서 구매 <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></div>` : '<div class="book-cta" style="color: var(--text-faint);">링크 없음</div>'}
      </div>
    </div>
  `;
}

async function loadMaterialsDetail(id) {
  const m = await window.api.call('getMaterial', { id });
  if (!m) {
    document.getElementById('materials-detail-content').innerHTML = '<div class="empty">자료를 찾을 수 없습니다</div>';
    return;
  }
  await loadAllCategoriesCache();
  const cat = findCategory(m.categoryId);
  const parent = cat && cat.parentId ? findCategory(cat.parentId) : null;
  let breadcrumb = '';
  if (cat) {
    if (parent) breadcrumb = `<div class="material-detail-breadcrumb">${escapeHtml(parent.name)} › ${escapeHtml(cat.name)}</div>`;
    else breadcrumb = `<div class="material-detail-breadcrumb">${escapeHtml(cat.name)}</div>`;
  }
  const steps = m.steps || [];
  document.getElementById('materials-detail-content').innerHTML = `
    <div class="material-detail-header">
      ${breadcrumb}
      <h1 class="material-detail-title">${escapeHtml(m.title)}</h1>
      ${m.description ? `<div class="material-detail-desc">${escapeHtml(m.description)}</div>` : ''}
    </div>
    ${steps.length === 0 
      ? '<div class="empty">단계 정보가 없습니다</div>'
      : steps.map((step, i) => `
        <div class="material-step">
          <div class="material-step-head">
            <div class="material-step-num">${i + 1}</div>
            <div class="material-step-title">${escapeHtml(step.title || '')}</div>
          </div>
          ${step.content ? `<div class="material-step-content">${linkifyContent(step.content)}</div>` : ''}
          ${step.imageUrl ? `<div class="material-step-image"><img src="${escapeHtml(step.imageUrl)}" alt="${escapeHtml(step.title || '')}" loading="lazy"></div>` : ''}
        </div>
      `).join('')
    }
  `;
}

// ============================================================
// 인앱 브라우저 처리: 카톡 자동 전환 + 그 외 안내 배너
// ============================================================
function handleInAppBrowser() {
  const type = getInAppBrowserType();
  if (!type) return;
  
  const currentUrl = window.location.href;
  
  // 모든 인앱 브라우저 (카톡 포함) → 자동 전환 X, 배너만 표시
  // 사용자가 [외부 브라우저 열기] 누르면 그때 새 창으로 전환
  showInAppBanner(type, currentUrl);
}

function getInAppBrowserName(type) {
  const names = {
    'kakao': '카카오톡',
    'line': '라인',
    'instagram': '인스타그램',
    'facebook': '페이스북',
    'naver': '네이버앱',
    'daum': '다음앱',
    'everytime': '에브리타임',
    'android-webview': '인앱 브라우저'
  };
  return names[type] || '인앱 브라우저';
}

function showInAppBanner(type, url) {
  // 사용자가 닫은 적 있으면 표시 안 함
  if (sessionStorage.getItem('inapp_banner_closed')) return;
  
  const name = getInAppBrowserName(type);
  const existing = document.getElementById('inapp-banner');
  if (existing) return;
  
  const banner = document.createElement('div');
  banner.id = 'inapp-banner';
  banner.className = 'inapp-banner';
  banner.innerHTML = `
    <svg class="inapp-banner-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <div class="inapp-banner-text">
      <div class="inapp-banner-title">${escapeHtml(name)} 인앱 브라우저로 보고 있어요</div>
      <div class="inapp-banner-sub">일부 기능 (줌 링크 등)이 제한될 수 있습니다</div>
    </div>
    <button class="inapp-banner-open" onclick="openExternalBrowser('${escapeHtml(url)}')">외부 브라우저 열기</button>
    <button class="inapp-banner-close" onclick="closeInAppBanner()" aria-label="닫기">×</button>
  `;
  document.body.appendChild(banner);
  
  // 등장 애니메이션
  setTimeout(() => banner.classList.add('show'), 50);
}

function closeInAppBanner() {
  const banner = document.getElementById('inapp-banner');
  if (banner) {
    banner.classList.remove('show');
    setTimeout(() => banner.remove(), 200);
  }
  sessionStorage.setItem('inapp_banner_closed', '1');
}

document.addEventListener('DOMContentLoaded', () => {
  // 초기 진입: 현재 history entry를 home으로 등록 (replaceState)
  history.replaceState({ page: 'home', params: {} }, '', '#');
  initQuickRail();
  navigate('home', {}, true);
  
  // 인앱 브라우저 처리 (페이지 로드 후 약간 딜레이)
  setTimeout(handleInAppBrowser, 600);
});
</script>
