<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8">
<title>SBS AIX학원 수강생 안내</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  /* 뉴트럴 - 쿨 그레이 계열 */
  --bg: #f4f5f8;
  --bg-elevated: #ffffff;
  --bg-soft: #edeef2;
  --bg-section: #f7f8fa;

  --text: #0d0f16;
  --text-mid: #2b2f3a;
  --text-soft: #565c6b;
  --text-faint: #8b91a0;

  --border: rgba(13, 15, 22, 0.06);
  --border-mid: rgba(13, 15, 22, 0.10);
  --border-strong: rgba(13, 15, 22, 0.16);

  /* 액센트 - 인디고 */
  --accent: #4f46e5;
  --accent-soft: #eeecff;
  --accent-mid: #6366f1;
  --accent-deep: #3730a3;
  --accent-ink: #1e1b4b;

  --danger: #e11d48;
  --danger-bg: #ffe4ea;
  --warning: #d97706;
  --warning-bg: #fef3e0;
  --notice: #f2f1ff;
  --notice-text: #383455;
  --notice-strong: #1e1b4b;
  --notice-label: #5b52d9;

  --m-1: #6d28d9; --m-1-bg: #f0eafe;
  --m-2: #0d9488; --m-2-bg: #d9f5f1;
  --m-3: #d97706; --m-3-bg: #fdf0d8;
  --m-4: #4f46e5; --m-4-bg: #eaeaff;
  --m-5: #db2777; --m-5-bg: #fde8f2;

  --shadow-xs: 0 1px 2px rgba(13, 15, 22, 0.04);
  --shadow-sm: 0 1px 2px rgba(13, 15, 22, 0.05), 0 2px 6px rgba(13, 15, 22, 0.045);
  --shadow-md: 0 2px 4px rgba(13, 15, 22, 0.05), 0 8px 20px rgba(13, 15, 22, 0.07);
  --shadow-lg: 0 4px 10px rgba(13, 15, 22, 0.07), 0 18px 38px rgba(13, 15, 22, 0.11);
  --shadow-hero: 0 10px 26px rgba(13, 15, 22, 0.26), 0 2px 8px rgba(13, 15, 22, 0.18);
  --shadow-accent: 0 4px 14px rgba(79, 70, 229, 0.32);

  /* 브랜드 그라데이션 */
  --grad-hero: linear-gradient(150deg, #23253a 0%, #16182a 46%, #0d0f18 100%);
  --grad-accent: linear-gradient(135deg, #6366f1 0%, #4f46e5 55%, #4338ca 100%);
  --grad-vivid: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);

  /* 타이포 스케일 */
  --fs-xs: 11.5px;
  --fs-sm: 12.5px;
  --fs-base: 14px;
  --fs-md: 15px;
  --fs-lg: 17px;
  --fs-xl: 20px;
  --fs-2xl: 24px;

  /* 라운드 스케일 */
  --r-sm: 9px;
  --r-md: 13px;
  --r-lg: 18px;
  --r-xl: 22px;

  --safe-top: env(safe-area-inset-top, 0);
  --safe-bottom: env(safe-area-inset-bottom, 0);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: var(--fs-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.014em;
}

body {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(64px + var(--safe-bottom));
  background: var(--bg);
}

button { font-family: inherit; cursor: pointer; }

/* ===== 헤더 ===== */
.header {
  position: sticky;
  top: 0;
  background: rgba(244, 245, 248, 0.86);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  padding: calc(12px + var(--safe-top)) 16px 11px;
  border-bottom: 0.5px solid var(--border);
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.header-logo {
  width: 38px; height: 38px;
  background: var(--grad-vivid);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: 0.01em;
  box-shadow: var(--shadow-accent);
}
.header-text { line-height: 1.2; }
.header-title {
  font-size: var(--fs-xs);
  color: var(--text-soft);
  font-weight: 500;
}
.header-page {
  font-size: var(--fs-lg);
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-top: 1px;
}
.header-actions { display: flex; gap: 6px; }
.header-btn {
  position: relative;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--bg-elevated);
  display: flex; align-items: center; justify-content: center;
  border: 0.5px solid var(--border-mid);
  color: var(--text-mid);
  box-shadow: var(--shadow-xs);
  transition: transform 0.12s, background 0.12s;
}
.header-btn:active { transform: scale(0.95); }
.header-btn-dot {
  position: absolute;
  width: 6px; height: 6px;
  background: var(--danger);
  border: 1.5px solid var(--bg);
  border-radius: 50%;
  top: 4px; right: 4px;
}

/* ===== 페이지 ===== */
.page { padding: 0; }
.page.hidden { display: none; }
.page-content { padding: 14px 14px 22px; }

/* ===== 안내사항 배너 ===== */
.notice-bar {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  margin: 12px 14px 0;
  padding: 11px 13px 11px 12px;
  background: linear-gradient(180deg, #f8f7ff 0%, var(--notice) 100%);
  border: 0.5px solid #ddd9fb;
  border-left: 3px solid var(--accent-mid);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-xs);
}
.notice-icon {
  width: 17px; height: 17px;
  flex-shrink: 0;
  margin-top: 1px;
  color: var(--notice-label);
}
.notice-content { flex: 1; min-width: 0; }
.notice-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 3px;
}
.notice-label {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--notice-label);
  letter-spacing: 0.03em;
}
.notice-text {
  font-size: var(--fs-sm);
  color: var(--notice-text);
  line-height: 1.6;
  letter-spacing: -0.012em;
  word-break: keep-all;
  white-space: pre-wrap;
}
.notice-text b { font-weight: 700; color: var(--notice-strong); }
/* 긴 안내는 두 줄만 보이고 눌러서 펼친다 */
.notice-text.clamped {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.notice-toggle {
  margin-left: auto;
  background: none;
  border: none;
  padding: 4px 0;
  font-family: inherit;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--notice-label);
  display: inline-flex;
  align-items: center;
  gap: 3px;
  letter-spacing: -0.014em;
}
.notice-toggle svg { width: 12px; height: 12px; transition: transform 0.2s; }
.notice-toggle.open svg { transform: rotate(180deg); }

/* ===== 이벤트 배너 (시간 비례 자동 슬라이드) ===== */
.banner-wrap {
  margin: 12px 14px 0;
  position: relative;
  --banner-dur: 5000ms;
}
/* 슬라이드가 옆으로 미끄러지는 창 */
.banner-viewport {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-md);
  touch-action: pan-y;
  cursor: grab;
}
.banner-viewport.dragging { cursor: grabbing; }
.banner-track {
  display: flex;
  width: 100%;
  will-change: transform;
  transition: transform 560ms cubic-bezier(0.33, 0.9, 0.28, 1);
}
.banner-track.no-anim { transition: none; }
.banner-slide {
  position: relative;
  flex: 0 0 100%;
  height: 116px;
  overflow: hidden;
  cursor: pointer;
  background: var(--grad-hero);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 13px;
  isolation: isolate;
  user-select: none;
  -webkit-user-select: none;
}
/* 포스터를 크게 흐려 깔아 배너 배경색으로 쓴다 - 어떤 비율이 와도 깨지지 않는다 */
.banner-bg {
  position: absolute;
  inset: -20%;
  width: 140%;
  height: 140%;
  object-fit: cover;
  filter: blur(26px) saturate(1.5) brightness(0.72);
  transform: scale(1.1);
  z-index: -2;
  -webkit-user-drag: none;
  pointer-events: none;
}
.banner-slide::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(100deg, rgba(9,10,18,0.86) 0%, rgba(9,10,18,0.62) 52%, rgba(9,10,18,0.34) 100%);
}
/* 이미지가 없는 슬라이드는 브랜드 그라데이션 + 발광 */
.banner-slide.no-img { background: var(--grad-vivid); }
.banner-slide.no-img::before {
  background: linear-gradient(100deg, rgba(9,10,18,0.52) 0%, rgba(9,10,18,0.18) 60%, rgba(9,10,18,0) 100%);
}
.banner-slide.no-img::after {
  content: '';
  position: absolute;
  top: -60%; right: -8%;
  width: 52%; aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0) 68%);
  z-index: -1;
}
.banner-body {
  position: relative;
  flex: 1;
  min-width: 0;
  color: #fff;
  pointer-events: none;
}
/* 원본 포스터는 잘리지 않게 통째로 담는다 */
.banner-thumb {
  position: relative;
  flex-shrink: 0;
  width: 74px;
  height: 92px;
  border-radius: var(--r-md);
  overflow: hidden;
  background: rgba(255,255,255,0.10);
  box-shadow: 0 4px 14px rgba(0,0,0,0.34);
  display: flex;
  align-items: center;
  justify-content: center;
}
.banner-thumb img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  -webkit-user-drag: none;
  pointer-events: none;
}
.banner-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.05em;
  padding: 3px 8px;
  border-radius: 100px;
  background: rgba(255,255,255,0.94);
  color: var(--accent-deep);
  margin-bottom: 6px;
}
.banner-badge.hot { background: #e11d48; color: #fff; }
.banner-title {
  font-size: var(--fs-md);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.32;
  text-shadow: 0 1px 10px rgba(0,0,0,0.5);
  overflow: hidden;
  max-height: 2.64em;
}
.banner-sub {
  font-size: var(--fs-xs);
  font-weight: 500;
  color: rgba(255,255,255,0.80);
  margin-top: 3px;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  white-space: nowrap;
  overflow: hidden;
}
/* 슬라이드 카운터 (우상단) */
.banner-counter {
  position: absolute;
  top: 11px; right: 12px;
  background: rgba(9, 10, 18, 0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 100px;
  font-variant-numeric: tabular-nums;
  z-index: 2;
  pointer-events: none;
}
/* 남은 시간이 차오르는 인디케이터 */
.banner-dots {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
}
.banner-dot {
  position: relative;
  height: 5px;
  width: 12px;
  border-radius: 100px;
  background: var(--border-strong);
  overflow: hidden;
  cursor: pointer;
  transition: width 0.4s cubic-bezier(0.33, 0.9, 0.28, 1), background 0.3s;
  flex-shrink: 0;
}
.banner-dot.active {
  width: 38px;
  background: rgba(79, 70, 229, 0.20);
}
/* 이 막대가 남은 시간에 비례해 차오른다 */
.banner-dot-fill {
  position: absolute;
  inset: 0;
  border-radius: 100px;
  background: var(--grad-accent);
  transform: scaleX(0);
  transform-origin: left center;
}
.banner-dot.active .banner-dot-fill {
  animation: bannerProgress var(--banner-dur) linear forwards;
}
.banner-wrap.paused .banner-dot.active .banner-dot-fill {
  animation-play-state: paused;
}
@keyframes bannerProgress {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
/* 모션을 줄이도록 설정한 기기에서는 미끄러짐과 차오름을 끈다 */
@media (prefers-reduced-motion: reduce) {
  .banner-track { transition-duration: 1ms; }
  .banner-dot.active .banner-dot-fill { animation: none; transform: scaleX(1); }
}

/* ===== 홈 히어로 (오늘 + 진행률 + 통계) ===== */
.hero {
  margin: 12px 14px 0;
  padding: 15px 16px 14px;
  border-radius: var(--r-xl);
  background: var(--grad-hero);
  color: #fff;
  box-shadow: var(--shadow-hero);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  top: -80px; right: -70px;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(124, 92, 246, 0.42) 0%, rgba(99, 102, 241, 0.14) 45%, rgba(255,255,255,0) 72%);
  pointer-events: none;
}
.hero::before {
  content: '';
  position: absolute;
  bottom: -90px; left: -50px;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(217, 70, 239, 0.20) 0%, rgba(217, 70, 239, 0) 70%);
  pointer-events: none;
}
.hero-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  position: relative;
  z-index: 1;
}
.hero-datewrap {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.hero-date {
  font-size: var(--fs-2xl);
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 1.15;
}
.hero-day {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: rgba(255,255,255,0.68);
  letter-spacing: -0.01em;
}
.hero-dday {
  flex-shrink: 0;
  background: rgba(255,255,255,0.16);
  border: 0.5px solid rgba(255,255,255,0.22);
  color: #fff;
  font-size: var(--fs-md);
  font-weight: 800;
  letter-spacing: -0.02em;
  padding: 7px 13px;
  border-radius: 100px;
  font-variant-numeric: tabular-nums;
  backdrop-filter: blur(6px);
}
.hero-dday.urgent {
  background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
  border-color: rgba(255,255,255,0.28);
  box-shadow: 0 3px 12px rgba(225, 29, 72, 0.45);
}

.hero-course {
  position: relative;
  z-index: 1;
  margin-top: 12px;
  padding-top: 11px;
  border-top: 0.5px solid rgba(255,255,255,0.16);
}
.hero-course-name {
  font-size: var(--fs-md);
  font-weight: 700;
  letter-spacing: -0.022em;
  line-height: 1.35;
  word-break: keep-all;
}
.hero-course-state {
  font-weight: 600;
  color: rgba(255,255,255,0.6);
  font-size: var(--fs-sm);
}
.hero-bar {
  height: 8px;
  background: rgba(255,255,255,0.15);
  border-radius: 100px;
  overflow: hidden;
  margin-top: 10px;
}
.hero-fill {
  height: 100%;
  background: linear-gradient(90deg, #818cf8 0%, #c4b5fd 60%, #f0abfc 100%);
  border-radius: 100px;
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.55);
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  min-width: 4px;
}
.hero-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 9px;
  font-size: var(--fs-xs);
  color: rgba(255,255,255,0.62);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.hero-meta b {
  color: #fff;
  font-weight: 700;
}

.hero-stats {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 8px;
  margin-top: 11px;
}
.hero-stat {
  flex: 1;
  background: rgba(255,255,255,0.11);
  border: 0.5px solid rgba(255,255,255,0.16);
  border-radius: var(--r-md);
  padding: 8px 11px;
}
.hero-stat-num {
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
}
.hero-stat-num small {
  font-size: var(--fs-xs);
  font-weight: 600;
  color: rgba(255,255,255,0.6);
  margin-left: 3px;
}
.hero-stat-label {
  font-size: var(--fs-xs);
  color: rgba(255,255,255,0.62);
  font-weight: 500;
  margin-top: 2px;
}

/* 과정 정보가 없을 때의 심플 히어로 */
.hero.hero-plain { padding-bottom: 17px; }

/* ===== 홈 메뉴 그리드 (2x2 카드 + 미리보기) ===== */
.hm-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 14px 14px 4px;
}
.hm-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 0;
  cursor: pointer;
  transition: transform 0.12s, box-shadow 0.18s;
  box-shadow: var(--shadow-sm);
  font-family: inherit;
  text-align: left;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 168px;
}
.hm-card:active {
  transform: scale(0.985);
  box-shadow: var(--shadow-md);
}
.hm-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 12px 12px;
}
.hm-icon-wrap {
  width: 40px; height: 40px;
  border-radius: var(--r-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.hm-icon-wrap svg {
  width: 20px; height: 20px;
}
/* 아이콘 톤 - 시인성 우선 */
.hm-icon-wrap.cal { background: #eaeaff; color: #4f46e5; }
.hm-icon-wrap.book { background: #d9f5f1; color: #0d9488; }
.hm-icon-wrap.zoom { background: #fdf0d8; color: #d97706; }
.hm-icon-wrap.users { background: #fde8f2; color: #db2777; }

.hm-title-wrap { flex: 1; min-width: 0; }
.hm-name {
  font-size: var(--fs-base);
  font-weight: 700;
  letter-spacing: -0.024em;
  color: var(--text);
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
}
.hm-count {
  font-size: var(--fs-xs);
  color: var(--text-faint);
  font-weight: 500;
  margin-top: 1px;
}
.hm-divider {
  height: 0.5px;
  background: var(--border);
  margin: 0 12px;
}
.hm-items {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding: 4px 6px 6px;
}
/* 미리보기 항목 = 실제 탭 가능한 행 (터치 영역 36px 이상) */
.hm-item {
  font-size: var(--fs-sm);
  color: var(--text-mid);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
  letter-spacing: -0.014em;
  min-height: 36px;
  padding: 5px 6px;
  border-radius: var(--r-sm);
  line-height: 1.3;
}
.hm-item-text {
  flex: 1;
  min-width: 0;
  white-space: normal;
  word-break: keep-all;
  line-height: 1.3;
  max-height: 2.6em;
  overflow: hidden;
}
.hm-item .dot {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #c3c3c3;
  flex-shrink: 0;
}
.hm-item .hm-chev {
  width: 13px; height: 13px;
  flex-shrink: 0;
  color: #c0c0c0;
  transition: color 0.12s, transform 0.12s;
}
.hm-item.clickable { cursor: pointer; transition: background 0.12s; }
.hm-item.clickable:active {
  background: var(--accent-soft);
  color: var(--accent);
}
.hm-item.clickable:active .hm-chev { color: var(--accent); transform: translateX(1px); }
@media (hover: hover) {
  .hm-item.clickable:hover { background: rgba(0, 0, 0, 0.035); color: var(--text); }
  .hm-item.clickable:hover .hm-chev { color: var(--text-soft); }
}
.hm-empty {
  font-size: var(--fs-sm);
  color: var(--text-faint);
  font-weight: 500;
  padding: 8px 6px;
}
/* 카드 하단 전체보기 */
.hm-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  margin-top: auto;
  padding: 9px 12px 10px;
  border-top: 0.5px solid var(--border);
  background: var(--bg-section);
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.014em;
}
.hm-foot svg { width: 13px; height: 13px; }

/* ===== 섹션 ===== */
.section {
  padding: 20px 14px 0;
}
.section-h {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
  gap: 8px;
  padding: 0 2px;
}
.section-t {
  font-size: var(--fs-md);
  font-weight: 700;
  letter-spacing: -0.026em;
}
.section-meta {
  font-size: var(--fs-xs);
  color: var(--text-faint);
  font-weight: 600;
  background: var(--bg-soft);
  padding: 2px 8px;
  border-radius: 100px;
}
.section-link {
  margin-left: auto;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  font-size: var(--fs-sm);
  color: var(--accent);
  font-weight: 700;
  background: none;
  border: none;
  padding: 0 9px;
  margin-right: -9px;
  border-radius: var(--r-sm);
  font-family: inherit;
  letter-spacing: -0.014em;
}
.section-link:active { background: var(--accent-soft); }

/* 카드형 리스트 컨테이너 */
.card-list {
  background: var(--bg-elevated);
  border: 0.5px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card-list:empty { display: none; }

/* ===== 일정 행 ===== */
.event {
  display: flex;
  align-items: center;
  padding: 12px 13px;
  gap: 11px;
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
  min-height: 56px;
  transition: background 0.12s;
}
.event:last-child { border-bottom: none; }
.event:active { background: var(--bg-section); }
.event-datebox {
  flex-shrink: 0;
  width: 42px;
  text-align: center;
  border-radius: var(--r-sm);
  padding: 5px 0 6px;
  background: var(--bg-section);
  border: 0.5px solid var(--border);
}
.event-datebox.today {
  background: var(--accent);
  border-color: var(--accent);
}
.event-datebox.today .event-date,
.event-datebox.today .event-day { color: #fff; }
.event-date {
  font-size: var(--fs-md);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1.1;
  color: var(--text);
}
.event-day {
  font-size: 10.5px;
  color: var(--text-faint);
  font-weight: 600;
  margin-top: 1px;
}
.event-main { flex: 1; min-width: 0; }
.event-title {
  font-size: var(--fs-base);
  white-space: nowrap;
  overflow: hidden;
  font-weight: 600;
  letter-spacing: -0.018em;
}
.event-sub {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 3px;
  font-size: var(--fs-xs);
  color: var(--text-faint);
  font-weight: 500;
}
.event-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.event-dday {
  font-size: var(--fs-xs);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  color: var(--text-soft);
  background: var(--bg-soft);
  padding: 4px 9px;
  border-radius: 100px;
  letter-spacing: -0.01em;
}
.event-dday.urgent { color: #fff; background: var(--danger); }

/* ===== 공지 행 (카드형) ===== */
.post {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
  transition: background 0.12s;
  position: relative;
  min-height: 64px;
}
.post:last-child { border-bottom: none; }
.post:active { background: var(--bg-section); }
/* 읽지 않은 공지 - 좌측 액센트 바 */
.post.unread::before {
  content: '';
  position: absolute;
  left: 0; top: 10px; bottom: 10px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--accent);
}
.post.read { opacity: 0.62; }
.post-tag {
  font-size: var(--fs-xs);
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 100px;
  flex-shrink: 0;
  letter-spacing: -0.01em;
}
.post-body { flex: 1; min-width: 0; }
.post-headline {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.post-thumb {
  width: 62px;
  height: 62px;
  border-radius: var(--r-md);
  object-fit: cover;
  flex-shrink: 0;
  border: 0.5px solid var(--border);
  background: var(--bg-soft);
}
.detail-image {
  margin: 6px 0 16px;
  border-radius: var(--r-lg);
  overflow: hidden;
  border: 0.5px solid var(--border);
  background: var(--bg-soft);
}
.detail-image img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 400px;
  object-fit: cover;
}
.post-title {
  font-size: var(--fs-base);
  font-weight: 600;
  letter-spacing: -0.018em;
  line-height: 1.45;
  color: var(--text);
  overflow: hidden;
  max-height: 2.9em;
}
.post-meta {
  font-size: var(--fs-xs);
  color: var(--text-faint);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}
.post-new {
  font-size: 10px;
  background: var(--danger);
  color: #fff;
  padding: 2px 6px;
  border-radius: 100px;
  font-weight: 800;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.tag-학사 { background: #eaeaff; color: #4338ca; }
.tag-세미나 { background: #f0eafe; color: #6d28d9; }
.tag-특강 { background: #f0eafe; color: #6d28d9; }
.tag-시설 { background: #d9f5f1; color: #0f766e; }
.tag-평가 { background: #fdf0d8; color: #b45309; }
.tag-이벤트 { background: #fde8f2; color: #be1863; }
.tag-취업 { background: #dcf0fd; color: #0369a1; }
.tag-기타 { background: #ecedf1; color: #475069; }

/* ===== 빈 상태 ===== */
.empty {
  text-align: center;
  padding: 34px 16px;
  color: var(--text-faint);
  font-size: var(--fs-sm);
  font-weight: 500;
  background: var(--bg-elevated);
  border: 0.5px dashed var(--border-mid);
  border-radius: var(--r-lg);
}
.empty-icon {
  width: 32px; height: 32px;
  margin: 0 auto 8px;
  background: var(--bg-soft);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== 상세 페이지 ===== */
.detail-back {
  background: none; border: none;
  font-size: 12.5px;
  color: var(--text-mid);
  padding: 6px 8px 6px 0;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 3px;
  font-family: inherit;
  font-weight: 500;
}
.detail-title {
  font-size: 19.5px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.3;
  margin: 4px 0 10px;
  padding-right: 32px;
}
.detail-title-wrap { position: relative; }
.detail-bookmark {
  position: absolute;
  top: 0; right: 0;
  width: 30px; height: 30px;
  border-radius: 6px;
  background: none;
  border: none;
  color: var(--text-faint);
  display: flex;
  align-items: center;
  justify-content: center;
}
.detail-bookmark.active { color: #d97706; }
.detail-bookmark.active svg { fill: #d97706; }
.detail-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 0.5px solid var(--border);
}
.detail-content {
  font-size: 13px;
  line-height: 1.85;
  white-space: pre-wrap;
  word-break: keep-all;
  color: var(--text-mid);
}
.detail-content a {
  color: var(--accent);
  text-decoration: underline;
}

/* ===== 카테고리 필터 ===== */
.filter-bar {
  display: flex; gap: 7px;
  overflow-x: auto;
  margin: 0 -14px 14px;
  padding: 2px 14px 6px;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
}
.filter-bar::-webkit-scrollbar { display: none; }
@media (min-width: 0px) {
  .filter-bar {
    -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 26px), transparent 100%);
    mask-image: linear-gradient(to right, #000 0, #000 calc(100% - 26px), transparent 100%);
  }
}
.filter-chip {
  flex-shrink: 0;
  min-height: 38px;
  padding: 0 15px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 0.5px solid var(--border-mid);
  border-radius: 100px;
  background: var(--bg-elevated);
  font-size: var(--fs-sm);
  cursor: pointer;
  font-family: inherit;
  color: var(--text-mid);
  font-weight: 600;
  letter-spacing: -0.014em;
  box-shadow: var(--shadow-xs);
  scroll-snap-align: start;
  transition: background 0.14s, color 0.14s, transform 0.1s;
}
.filter-chip:active { transform: scale(0.95); }
.filter-chip.active {
  background: var(--grad-accent);
  color: #fff;
  border-color: transparent;
  font-weight: 700;
  box-shadow: var(--shadow-accent);
}
.filter-chip-count {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-faint);
  background: var(--bg-soft);
  padding: 1px 6px;
  border-radius: 100px;
  font-variant-numeric: tabular-nums;
}
.filter-chip.active .filter-chip-count {
  color: #fff;
  background: rgba(255,255,255,0.22);
}

/* 게시판 상단 요약 바 */
.posts-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  padding: 0 2px;
}
.posts-count {
  font-size: var(--fs-sm);
  color: var(--text-soft);
  font-weight: 600;
}
.posts-count b { color: var(--text); font-weight: 800; }
.posts-search-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 13px;
  border-radius: 100px;
  border: 0.5px solid var(--border-mid);
  background: var(--bg-elevated);
  color: var(--text-mid);
  font-size: var(--fs-sm);
  font-weight: 600;
  font-family: inherit;
  box-shadow: var(--shadow-xs);
}
.posts-search-btn:active { background: var(--bg-soft); transform: scale(0.96); }

/* ===== 검색 ===== */
.search-bar {
  display: flex;
  align-items: center;
  background: var(--bg-elevated);
  border: 0.5px solid var(--border-mid);
  border-radius: 10px;
  padding: 0 12px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-xs);
}
.search-bar:focus-within { border-color: var(--accent); }
.search-input {
  flex: 1;
  padding: 9px 8px;
  border: none;
  background: none;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  color: var(--text);
}
.search-clear {
  background: none;
  border: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
}
.search-highlight {
  background: #e5e2ff;
  color: #3730a3;
  padding: 0 2px;
  border-radius: 2px;
  font-weight: 600;
}

/* ===== 캘린더 ===== */
.cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 10px;
  padding: 0 2px;
}
.cal-month {
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.25;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
}
.cal-nav { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.cal-nav-btn {
  width: 36px; height: 36px;
  border-radius: var(--r-sm);
  background: var(--bg-elevated);
  border: 0.5px solid var(--border-mid);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-mid);
  box-shadow: var(--shadow-xs);
}
.cal-nav-btn:active { background: var(--bg-soft); transform: scale(0.94); }
.cal-today-btn {
  padding: 0 13px;
  height: 36px;
  border-radius: var(--r-sm);
  background: var(--bg-elevated);
  border: 0.5px solid var(--border-mid);
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--accent);
  font-family: inherit;
  box-shadow: var(--shadow-xs);
}
.cal-today-btn:active { background: var(--accent-soft); }

.cal-grid {
  background: var(--bg-elevated);
  border: 0.5px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  padding-bottom: 4px;
}
.cal-week-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: var(--bg-section);
  border-bottom: 0.5px solid var(--border);
}
.cal-week-day {
  padding: 9px 0;
  text-align: center;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--text-soft);
  letter-spacing: 0.02em;
}
.cal-week-day.sun { color: var(--danger); }
.cal-week-day.sat { color: var(--accent); }
.cal-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 4px 3px 0;
  row-gap: 2px;
}
/* 격자선을 걷어내고 여백으로 칸을 나눈다 */
.cal-day {
  min-height: 60px;
  padding: 3px 1px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  position: relative;
  border-radius: var(--r-sm);
  transition: background 0.12s;
}
.cal-day:active { background: var(--bg-soft); }

.cal-day.cal-day-empty {
  background: transparent;
  cursor: default;
  pointer-events: none;
}
.cal-day.out-range { cursor: default; }
.cal-day.out-range .cal-day-num { color: #cbd0da; }

/* 지나간 날 - 흐리게 하되 읽을 수는 있게 */
.cal-day.past .cal-day-num { color: var(--text-faint); font-weight: 500; }
.cal-day.past .cal-event-dot { opacity: 0.45; }

/* 날짜 숫자는 원 안에 놓아 오늘/선택 표시가 또렷하게 보이게 한다 */
.cal-day-num {
  width: 30px; height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 14.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--text);
  transition: background 0.15s, color 0.15s;
}
.cal-day.sun .cal-day-num { color: var(--danger); }
.cal-day.sat .cal-day-num { color: var(--accent); }

/* 선택된 날 - 옅은 채움 */
.cal-day.selected { background: var(--accent-soft); }
.cal-day.selected .cal-day-num { font-weight: 800; }

/* 오늘 - 꽉 찬 원 */
.cal-day.today .cal-day-num {
  background: var(--grad-accent);
  color: #fff !important;
  font-weight: 800;
  box-shadow: var(--shadow-accent);
}
.cal-day.today.selected { background: var(--accent-soft); }

/* 휴강일 - 칸 전체를 옅게 물들여 한눈에 구분되게 */
.cal-day.has-cancel { background: rgba(225, 29, 72, 0.07); }
.cal-day.has-cancel .cal-day-num { color: var(--danger); font-weight: 700; }
.cal-day.has-cancel.today .cal-day-num { color: #fff; }

.cal-events {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 3px;
  margin-top: 4px;
  height: 8px;
  width: 100%;
}
.cal-event-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cal-event-more {
  font-size: 9px;
  font-weight: 700;
  color: var(--text-faint);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

/* 달이 바뀌는 칸에 월을 적어 어느 달인지 바로 알 수 있게 한다 */
.cal-month-tag {
  font-size: 9.5px;
  font-weight: 800;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 100px;
  padding: 1px 6px;
  line-height: 1.4;
  letter-spacing: -0.01em;
  margin-bottom: 1px;
}
.cal-day.month-start .cal-day-num { width: 26px; height: 26px; font-size: 13.5px; }
/* 월 표식이 없는 칸은 높이를 맞추기 위한 빈 자리 */
.cal-month-spacer { height: 16px; }

/* 개강 / 종강 표식 */
.cal-day.start-day::after,
.cal-day.end-day::after {
  position: absolute;
  bottom: -1px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: -0.01em;
  padding: 1px 5px;
  border-radius: 100px;
  white-space: nowrap;
}
.cal-day.start-day::after {
  content: '개강';
  background: #d9f5f1;
  color: #0f766e;
}
.cal-day.end-day::after {
  content: '종강';
  background: #fde8f2;
  color: #be1863;
}

.cal-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 11px 12px;
  background: var(--bg-elevated);
  border: 0.5px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 12px;
  box-shadow: var(--shadow-xs);
}
.cal-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-sm);
  color: var(--text-mid);
  font-weight: 600;
  background: var(--bg-section);
  padding: 5px 10px;
  border-radius: 100px;
}
.cal-legend-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* 수업일정 정보 배너 */
.cal-course-banner {
  background: var(--grad-hero);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  margin-bottom: 10px;
  color: #fff;
  box-shadow: var(--shadow-md);
}
.cal-course-name {
  font-size: var(--fs-md);
  font-weight: 800;
  letter-spacing: -0.026em;
  line-height: 1.35;
}
.cal-course-period {
  font-size: var(--fs-sm);
  color: rgba(255,255,255,0.72);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.cal-course-cancel {
  font-size: var(--fs-xs);
  color: #fda4c0;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 0.5px solid rgba(255,255,255,0.16);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  word-break: keep-all;
  line-height: 1.55;
}

.cal-selected-day { margin-top: 18px; }
.cal-selected-title {
  font-size: var(--fs-sm);
  font-weight: 600;
  margin-bottom: 10px;
  padding: 0 2px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.cal-selected-title-date {
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: -0.028em;
}
.cal-selected-title-day {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text-soft);
}

/* 참여 링크 버튼 (공지/세미나 상세) */

/* 줌 가이드 버튼 */

}

.zoom-guide-btn-title { font-size: 13px; font-weight: 700; letter-spacing: -0.018em; }
.zoom-guide-btn-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; font-weight: 500; }
.zoom-guide-btn-arrow { color: var(--text-faint); flex-shrink: 0; }

/* 인앱 브라우저 안내 배너 (상단 고정) */
.inapp-banner {
  position: fixed;
  top: 0;
  left: 0;

  padding-top: max(10px, env(safe-area-inset-top));

  align-items: center;
  gap: 9px;

}
.inapp-banner.show { transform: translateY(0); }
.inapp-banner-icon {
  flex-shrink: 0;

}
.inapp-banner-text {
  flex: 1;
  min-width: 0;
}

  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.018em;
  color: #fff;
}
.inapp-banner-sub {
  font-size: 10.5px;

  margin-top: 1px;
  font-weight: 500;
}
.inapp-banner-open {
  background: #fff;

  border-radius: 7px;

}

  background: transparent;

  color: rgba(255, 255, 255, 0.7);

  height: 28px;
  border-radius: 50%;
  font-size: 19px;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
}
.inapp-banner-close:active { background: rgba(255, 255, 255, 0.15); }

/* 줌 가이드 배너 (이미지 자체) */
.zoom-guide-banner {
  position: relative;

  border-radius: 12px;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: transform 0.1s;
}

.zoom-guide-banner img {
  display: block;

  pointer-events: none;
}

  border-radius: 100px;
  letter-spacing: -0.012em;
  pointer-events: none;

}

/* 이미지 풀스크린 모달 */
.image-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);

}

}

  right: 12px;

  color: #fff;

  cursor: pointer;
  z-index: 1001;
  display: flex;
  align-items: center;

}

/* 세미나 카드 */
.seminar-card {
  background: var(--bg-elevated);

/* 홈 세미나 캐러셀 (수동 스와이프 + 스냅) */
.seminar-carousel-wrap {

}

}

  box-shadow: var(--shadow-xs);
}
.book-card:active { transform: scale(0.99); box-shadow: var(--shadow-sm); }
.book-card:hover { box-shadow: var(--shadow-sm); }
.book-thumb {
  width: 88px;
  aspect-ratio: 3 / 4;
  background: var(--bg-soft);
  flex-shrink: 0;
  overflow: hidden;
  position: relative;
}
.book-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.book-thumb-noimg {
  width: 100%; height: 100%;
  background: var(--grad-accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.018em;
  line-height: 1.3;
  word-break: keep-all;
}
.book-body {
  flex: 1;
  padding: 12px 13px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
}
.book-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.018em;
  color: var(--text);
  line-height: 1.35;
}
.book-sub {
  font-size: 10.5px;
  color: var(--text-soft);
  margin-top: 3px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.book-price {
  font-size: 13px;
  font-weight: 800;
  color: var(--accent);
  margin-top: 5px;
  letter-spacing: -0.018em;
  font-variant-numeric: tabular-nums;
}
.book-cta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  margin-top: 6px;
  letter-spacing: -0.012em;
}

/* 수업안내 - 단계별 가이드 */
.material-detail-header {
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 0.5px solid var(--border);
}
.material-detail-breadcrumb {
  font-size: 11.5px;
  color: var(--text-faint);
  margin-bottom: 6px;
  font-weight: 500;
}
.material-detail-title {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.3;
  margin-bottom: 6px;
}
.material-detail-desc {
  font-size: 13px;
  color: var(--text-soft);
  line-height: 1.55;
}
.material-step {
  margin-bottom: 22px;
  position: relative;
}
.material-step-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}
.material-step-num {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11.5px;
  font-weight: 700;
  flex-shrink: 0;
}
.material-step-title {
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: -0.022em;
  line-height: 1.35;
}
.material-step-content {
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-mid);
  white-space: pre-wrap;
  word-break: keep-all;
  padding-left: 31px;
}
.material-step-image {
  margin-top: 10px;
  margin-left: 31px;
  border-radius: 8px;
  overflow: hidden;
  border: 0.5px solid var(--border);
}
.material-step-image img {
  display: block;
  width: 100%;
  height: auto;
}
.material-step:not(:last-child)::after {
  content: '';
  position: absolute;
  left: 10px; top: 28px; bottom: -14px;
  width: 1.5px;
  background: var(--bg-section);
}

/* ===== 강의장 / 비대면 ===== */
.contact-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 0.5px solid var(--border);
}
.contact-row:last-child { border-bottom: none; }
.contact-icon {
  width: 32px; height: 32px;
  border-radius: 9px;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}
.contact-content { flex: 1; min-width: 0; }
.contact-label {
  font-size: 11px;
  color: var(--text-faint);
  font-weight: 500;
}
.contact-value {
  font-size: 13px;
  font-weight: 500;
  margin-top: 1px;
  word-break: break-all;
}

/* 월별 헤더 (일정 페이지) */
.month-header {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 18px 4px 10px;
}
.month-header:first-child { margin-top: 4px; }
.month-header-text {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.month-header-line {
  flex: 1;
  height: 0.5px;
  background: var(--border);
}

/* 펼쳤을 때 뒤를 덮어 메뉴가 떠 있는 것으로 읽히게 한다 */
.quick-scrim {
  position: fixed;
  inset: 0;
  z-index: 19;
  background: rgba(13, 15, 22, 0.34);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s;
}
.quick-scrim.show { opacity: 1; pointer-events: auto; }

/* ===== 좌측 퀵메뉴 레일 (스크롤을 따라다니고 드래그로 옮길 수 있음) ===== */
.quick-rail {
  position: fixed;
  left: 8px;
  top: 50%;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 6px;
  border-radius: 100px;
  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border: 0.5px solid var(--border-mid);
  box-shadow: var(--shadow-lg);
  touch-action: none;
  transition: opacity 0.25s, transform 0.2s;
  user-select: none;
  -webkit-user-select: none;
}
/* 스크롤 중에는 물러나 본문을 가리지 않는다 */
.quick-rail.dim { opacity: 0.38; }
.quick-rail.dragging {
  transition: none;
  transform: scale(1.06);
  box-shadow: 0 10px 30px rgba(13, 15, 22, 0.26);
}
/* 평소에는 동그란 버튼 하나로 접혀 있어 본문을 덮지 않는다 */
.quick-rail.collapsed {
  background: none;
  border-color: transparent;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  padding: 0;
}
.quick-rail.collapsed .quick-items { display: none; }

.quick-toggle {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 0.5px solid rgba(255,255,255,0.28);
  background: var(--grad-accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-accent);
  font-family: inherit;
  flex-shrink: 0;
  cursor: grab;
  transition: transform 0.2s;
}
.quick-toggle svg { width: 20px; height: 20px; transition: transform 0.25s; }
.quick-rail:not(.collapsed) .quick-toggle svg { transform: rotate(135deg); }
.quick-rail.dragging .quick-toggle { cursor: grabbing; }

.quick-items {
  display: flex;
  flex-direction: column;
  gap: 6px;
  animation: quickIn 0.22s cubic-bezier(0.33, 0.9, 0.28, 1);
}
@keyframes quickIn {
  from { opacity: 0; transform: translateY(-8px) scale(0.9); }
  to   { opacity: 1; transform: none; }
}

.quick-btn {
  position: relative;
  width: 42px; height: 42px;
  border-radius: 50%;
  border: none;
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
  font-family: inherit;
  transition: transform 0.12s, background 0.15s;
}
.quick-btn svg { width: 19px; height: 19px; }
.quick-btn:active { transform: scale(0.9); }
.quick-btn.active { background: var(--grad-accent); box-shadow: var(--shadow-accent); }
.quick-btn.active svg { color: #fff !important; }
.quick-btn.cal { color: #4f46e5; }
.quick-btn.book { color: #0d9488; }
.quick-btn.zoom { color: #d97706; }
.quick-btn.users { color: #db2777; }
.quick-btn.top { color: var(--text-soft); }

/* 아이콘 옆 이름표 */
.quick-tip {
  position: absolute;
  left: 50px;
  top: 50%;
  transform: translateY(-50%) translateX(-6px);
  background: rgba(13, 15, 22, 0.9);
  color: #fff;
  font-size: var(--fs-xs);
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 100px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.16s, transform 0.16s;
}
.quick-rail:not(.collapsed) .quick-tip {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}

/* ===== 탭바 ===== */
.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  max-width: 480px; margin: 0 auto;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--border);
  display: flex;
  padding: 6px 0 calc(8px + var(--safe-bottom));
  z-index: 10;
}
.tab {
  flex: 1;
  background: none; border: none;
  padding: 7px 0;
  text-align: center;
  position: relative;
  font-family: inherit;
}
.tab-icon {
  width: 23px; height: 23px;
  margin: 0 auto 4px;
  color: var(--text-faint);
  display: block;
  stroke-width: 2;
  transition: color 0.14s, transform 0.14s;
}
.tab-label {
  font-size: var(--fs-xs);
  color: var(--text-faint);
  font-weight: 600;
  letter-spacing: -0.016em;
}
.tab.active .tab-icon { color: var(--accent); stroke-width: 2.5; transform: translateY(-1px); }
.tab.active .tab-label { color: var(--accent); font-weight: 800; }
.tab-badge {
  position: absolute;
  top: 4px;
  left: 50%; margin-left: 5px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--danger);
  border: 1.5px solid var(--bg);
}

.admin-link {
  display: block;
  text-align: center;

  padding: 13px;
  font-size: var(--fs-sm);
  color: var(--text-faint);
  text-decoration: none;

  border: 0.5px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-elevated);
}
.admin-link:active { background: var(--bg-soft); }
</style>
</head>

<script>
const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);

const state = {
  currentPage: 'home',
  pageTitles: {
    home: '홈',
    posts: '공지사항',
    search: '검색',
    'post-detail': '공지 상세',
    schedule: '수업일정',
    classrooms: '비대면 안내',
    rules: '이용안내',
    seminars: '특강·세미나',
    'seminar-detail': '특강·세미나',
    materials: '수업안내',
    'materials-sub': '수업안내',
    'materials-list': '수업안내',
    'materials-detail': '수업안내'
  },
  history: ['home'],
  cal: {
    year: TODAY.getFullYear(),
    month: TODAY.getMonth(),
    selectedDate: TODAY.toISOString().split('T')[0],
    schedule: [],
    colors: []
  },
  matCatsCache: null,
  searchData: null,
  allPosts: null,
  postFilter: '전체',
  bannerIndex: 0,
  bannerCount: 0,
  bannerTimer: null
};

// ============================================================
// 읽음/북마크
// ============================================================
function getReadIds() {
  try { return JSON.parse(localStorage.getItem('read_posts') || '[]'); }
  catch { return []; }
}
function markRead(id) {
  const ids = new Set(getReadIds());
  ids.add(id);
  localStorage.setItem('read_posts', JSON.stringify([...ids]));
}
function isRead(id) { return getReadIds().includes(id); }

function getBookmarks() {
  try { return JSON.parse(localStorage.getItem('bookmarks') || '[]'); }
  catch { return []; }
}
function toggleBookmark(id) {
  const list = getBookmarks();
  const idx = list.indexOf(id);
  if (idx >= 0) list.splice(idx, 1);
  else list.push(id);
  localStorage.setItem('bookmarks', JSON.stringify(list));
  return list.includes(id);
}
function isBookmarked(id) { return getBookmarks().includes(id); }

// ============================================================
// 라우팅
// ============================================================
// 내부 호출 (브라우저 뒤로가기에서 호출 시 isPopState=true)
function navigate(page, params = {}, isPopState = false) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  const target = document.getElementById('page-' + page);
  if (target) target.classList.remove('hidden');
  document.getElementById('page-name').textContent = state.pageTitles[page] || '';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const activeTab = document.querySelector(`.tab[data-page="${page}"]`);
  if (activeTab) activeTab.classList.add('active');
  
  // 브라우저 history에 push (popstate가 아닌 정상 navigate일 때만)
  if (!isPopState) {
    if (state.currentPage !== page || JSON.stringify(state.currentParams || {}) !== JSON.stringify(params)) {
      const url = page === 'home' ? '#' : `#${page}${params.id ? '/' + params.id : ''}${params.parentId ? '/' + params.parentId : ''}${params.categoryId ? '/' + params.categoryId : ''}`;
      history.pushState({ page, params }, '', url);
    }
  }
  
  state.currentPage = page;
  state.currentParams = params;

  syncQuickRail();

  if (page === 'home') loadHome();
  else if (page === 'posts') loadPosts();
  else if (page === 'post-detail') loadPostDetail(params.id);
  else if (page === 'schedule') loadSchedule(params.courseId);
  else if (page === 'classrooms') loadClassrooms();
  else if (page === 'rules') loadRules();
  else if (page === 'seminars') loadSeminars();
  else if (page === 'seminar-detail') loadSeminarDetail(params.id);
  else if (page === 'search') initSearch();
  else if (page === 'materials') loadMaterials();
  else if (page === 'materials-sub') loadMaterialsSub(params.parentId);
  else if (page === 'materials-list') loadMaterialsList(params.categoryId);
  else if (page === 'materials-detail') loadMaterialsDetail(params.id);

  window.scrollTo(0, 0);
}

function goBack() {
  // 브라우저 history의 back을 호출 → popstate 핸들러가 navigate 처리
  if (history.length > 1 && history.state) {
    history.back();
  } else {
    navigate('home');
  }
}

// 브라우저 뒤로가기 핸들러
window.addEventListener('popstate', (e) => {
  const s = e.state;
  if (s && s.page) {
    navigate(s.page, s.params || {}, true);
  } else {
    navigate('home', {}, true);
  }
});

// ============================================================
// 유틸
// ============================================================
function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}
function formatDateShort(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function formatFullDate(d) {
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
}
function formatDayShort(dateStr) {
  const d = new Date(dateStr);
  const days = ['일','월','화','수','목','금','토'];
  return days[d.getDay()];
}
function isNew(dateStr, days = 3) {
  const d = new Date(dateStr);
  const diff = (TODAY - d) / (1000 * 60 * 60 * 24);
  return diff <= days && diff >= -1;
}
function getDday(dateStr) {
  const d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  const diff = Math.round((d - TODAY) / (1000 * 60 * 60 * 24));
  if (diff === 0) return 'D-DAY';
  if (diff > 0) return `D-${diff}`;
  return `D+${Math.abs(diff)}`;
}
function isToday(dateStr) {
  const d = new Date(dateStr);
  return d.toDateString() === TODAY.toDateString();
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function linkifyContent(s) {
  if (s == null) return '';
  let escaped = escapeHtml(s);
  escaped = escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return escaped;
}
function tagClass(category) {
  const known = ['학사','세미나','특강','시설','평가','이벤트','취업'];
  return known.includes(category) ? `tag-${category}` : 'tag-기타';
}
function getColorById(id) {
  if (!id) return null;
  return (state.cal.colors || []).find(c => c.id === id);
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// ============================================================
// 홈 메뉴 카드 미리보기 (수업일정 / 수업안내 / 비대면 / 특강·세미나)
// ============================================================
function renderHomeMenuPreviews({ courses, matCats, classrooms, seminars }) {
  const CHEV = '<svg class="hm-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  const row = (label, onclick) =>
    `<div class="hm-item clickable" role="button" tabindex="0" onclick="event.stopPropagation(); ${onclick}">` +
    `<span class="dot"></span><span class="hm-item-text">${label}</span>${CHEV}</div>`;
  const setCount = (id, text) => {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  };

  // === 1. 수업일정 - 최신 시작일 순 3개 ===
  const sortedCourses = (courses || [])
    .filter(c => c.startDate && c.endDate)
    .sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
  const showC = sortedCourses.slice(0, 3);
  setCount('hm-count-schedule', sortedCourses.length > 0 ? `과정 ${sortedCourses.length}개` : '등록 없음');
  document.getElementById('hm-preview-schedule').innerHTML = showC.length === 0
    ? '<div class="hm-empty">등록된 수업일정 없음</div>'
    : showC.map(c => row(escapeHtml(c.name), `navigate('schedule', { courseId: '${c.id}' })`)).join('');

  // === 2. 수업안내 - 최상위 카테고리 3개 ===
  const topCats = (matCats || []).filter(c => !c.parentId);
  const showM = topCats.slice(0, 3);
  setCount('hm-count-materials', topCats.length > 0 ? `${topCats.length}개 분류` : '등록 없음');
  document.getElementById('hm-preview-materials').innerHTML = showM.length === 0
    ? '<div class="hm-empty">등록된 카테고리 없음</div>'
    : showM.map(c => row(escapeHtml(c.name), `navigate('materials-list', { categoryId: '${c.id}' })`)).join('');

  // === 3. 비대면 - 줌 접속방법 + 강의장 ===
  const cls = classrooms || [];
  setCount('hm-count-classrooms', cls.length > 0 ? `강의장 ${cls.length}개` : '접속 정보');
  document.getElementById('hm-preview-classrooms').innerHTML =
    row('줌 접속 방법', "navigate('classrooms')") +
    row(cls.length > 0 ? `강의장 ${cls.length}개` : '강의장 정보', "navigate('classrooms')");

  // === 4. 특강·세미나 - 최신 3개 ===
  const allS = seminars || [];
  const showS = allS.slice(0, 3);
  setCount('hm-count-seminars', allS.length > 0 ? `${allS.length}건 진행` : '등록 없음');
  document.getElementById('hm-preview-seminars').innerHTML = showS.length === 0
    ? '<div class="hm-empty">등록된 세미나 없음</div>'
    : showS.map(s => row(escapeHtml(s.title), `navigate('seminar-detail', { id: '${s.id}' })`)).join('');

  fitTextsSoon(document.getElementById('home-menu-grid'));
}

// ============================================================
// 좌측 퀵메뉴 레일
// ============================================================
// 스크롤해도 자리를 지키고, 손잡이를 잡고 위아래로 옮길 수 있다.
// 옮긴 자리는 다음 방문에도 그대로 남는다.
const RAIL_POS_KEY = 'quick_rail_top';
const RAIL_OPEN_KEY = 'quick_rail_open';

function initQuickRail() {
  const rail = document.getElementById('quick-rail');
  const toggle = document.getElementById('quick-toggle');
  if (!rail || !toggle) return;

  const clampTop = (top) => {
    const h = rail.offsetHeight;
    const min = 72;                              // 헤더 아래
    const max = window.innerHeight - h - 76;     // 탭바 위
    return Math.max(min, Math.min(Math.max(min, max), top));
  };

  const applyTop = (top) => { rail.style.top = clampTop(top) + 'px'; };
  state.railTop = null;

  const saved = parseFloat(localStorage.getItem(RAIL_POS_KEY));
  state.railTop = Number.isFinite(saved) ? saved : window.innerHeight * 0.70;
  applyTop(state.railTop);

  // 지난번에 펼쳐둔 채로 나갔다면 그대로 펼쳐 준다
  if (localStorage.getItem(RAIL_OPEN_KEY) === '1') setRailOpen(true);

  let dragging = false, startY = 0, startTop = 0, moved = false;

  const down = (e) => {
    const pt = e.touches ? e.touches[0] : e;
    dragging = true; moved = false;
    startY = pt.clientY;
    startTop = rail.getBoundingClientRect().top;
    rail.classList.add('dragging');
    rail.classList.remove('dim');
    if (e.cancelable) e.preventDefault();
  };

  const move = (e) => {
    if (!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const dy = pt.clientY - startY;
    if (Math.abs(dy) > 4) moved = true;
    if (moved) applyTop(startTop + dy);
    if (e.cancelable) e.preventDefault();
  };

  const up = () => {
    if (!dragging) return;
    dragging = false;
    rail.classList.remove('dragging');
    if (moved) {
      // 옮긴 자리를 기억한다
      state.railTop = rail.getBoundingClientRect().top;
      localStorage.setItem(RAIL_POS_KEY, String(state.railTop));
    } else {
      // 움직이지 않았으면 탭으로 보고 열고 닫는다
      setRailOpen(rail.classList.contains('collapsed'));
    }
  };

  toggle.addEventListener('touchstart', down, { passive: false });
  toggle.addEventListener('mousedown', down);
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchend', up);
  window.addEventListener('mouseup', up);

  // 스크롤 중에는 흐려졌다가 멈추면 돌아온다
  let dimTimer = null;
  window.addEventListener('scroll', () => {
    if (dragging) return;
    rail.classList.add('dim');
    clearTimeout(dimTimer);
    dimTimer = setTimeout(() => rail.classList.remove('dim'), 550);
  }, { passive: true });

  window.addEventListener('resize', () => applyTop(rail.getBoundingClientRect().top));

  syncQuickRail();
}

function setRailOpen(open) {
  const rail = document.getElementById('quick-rail');
  if (!rail) return;
  rail.classList.toggle('collapsed', !open);
  const scrim = document.getElementById('quick-scrim');
  if (scrim) scrim.classList.toggle('show', open);
  const toggle = document.getElementById('quick-toggle');
  if (toggle) toggle.setAttribute('aria-label', open ? '빠른 이동 메뉴 닫기' : '빠른 이동 메뉴 열기');
  localStorage.setItem(RAIL_OPEN_KEY, open ? '1' : '0');
  // 펼치면 키가 커지므로 화면 밖으로 나가지 않게 다시 잡아준다
  requestAnimationFrame(() => {
    const h = rail.offsetHeight;
    const min = 72;
    const max = window.innerHeight - h - 76;
    const cur = rail.getBoundingClientRect().top;
    rail.style.top = Math.max(min, Math.min(Math.max(min, max), cur)) + 'px';
  });
}

function quickGo(page) {
  setRailOpen(false);
  navigate(page);
}

function quickTop() {
  setRailOpen(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 현재 보고 있는 페이지의 아이콘을 채워 표시한다
function syncQuickRail() {
  const rail = document.getElementById('quick-rail');
  if (!rail) return;
  rail.querySelectorAll('.quick-btn[data-page]').forEach(b => {
    b.classList.toggle('active', b.dataset.page === state.currentPage);
  });
}

// ============================================================
// 글자 자동 맞춤
// ============================================================
// 칸을 넘치는 글자는 ...으로 자르는 대신 폰트를 단계적으로 줄여
// 한 칸 안에 온전히 담는다. 최소 크기까지 줄여도 안 되면 그때만 말줄임.
const FIT_MIN = {
  '.hm-item-text': 10.5,
  '.hm-name': 10.5,
  '.event-title': 11,
  '.post-title': 11,
  '.banner-title': 11.5,
  '.banner-sub': 9.5,
  '.seminar-carousel-title': 10,
  '.cal-course-name': 11.5,
  '.cal-month': 11.5
};
const FIT_SELECTOR = Object.keys(FIT_MIN).join(', ');

function fitOne(el, minSize) {
  // 이전에 줄여둔 값을 지우고 원래 크기부터 다시 계산한다
  el.style.fontSize = '';
  el.style.textOverflow = '';
  const base = parseFloat(getComputedStyle(el).fontSize);
  if (!base) return;

  const overflows = () =>
    el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;

  if (!overflows()) return;

  let size = base;
  while (size > minSize && overflows()) {
    size = Math.max(minSize, size - 0.5);
    el.style.fontSize = size.toFixed(1) + 'px';
  }
  // 최소 크기에서도 넘치면 그때는 말줄임으로 마무리
  if (overflows()) el.style.textOverflow = 'ellipsis';
}

function fitTexts(root) {
  const scope = root || document;
  scope.querySelectorAll(FIT_SELECTOR).forEach(el => {
    const key = Object.keys(FIT_MIN).find(sel => el.matches(sel));
    if (key) fitOne(el, FIT_MIN[key]);
  });
}

// 렌더 직후 레이아웃이 확정된 다음 프레임에 맞춘다
function fitTextsSoon(root) {
  requestAnimationFrame(() => fitTexts(root));
}

// 웹폰트가 늦게 도착하면 폭이 달라지므로 한 번 더 맞춘다
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => fitTexts());
}
// 화면 회전 등으로 폭이 바뀌면 다시 계산
let fitResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(fitResizeTimer);
  fitResizeTimer = setTimeout(() => fitTexts(), 160);
});

// ============================================================
// 이벤트 배너 (시간 비례 자동 슬라이드)
// ============================================================
// 운영자가 등록한 배너(getBanners)를 우선 사용하고,
// 없으면 이벤트/특강 성격의 공지 + 예정 세미나로 자동 구성한다.
function buildBanners({ banners, posts, seminars }) {
  // 클릭 시 어디로 갈지를 문자열이 아니라 유형+대상으로 들고 다닌다
  const linkOf = (o) => {
    if (o.postId) return { type: 'post', target: o.postId };
    if (o.seminarId) return { type: 'seminar', target: o.seminarId };
    if (o.linkUrl) return { type: 'link', target: o.linkUrl };
    return { type: 'posts', target: '' };
  };

  const registered = (banners || []).filter(b => b && (b.imageUrl || b.title));
  if (registered.length > 0) {
    return registered.slice(0, 6).map(b => Object.assign({
      title: b.title || '',
      sub: b.subtitle || b.sub || '',
      badge: b.badge || '이벤트',
      hot: !!b.hot,
      imageUrl: b.imageUrl || ''
    }, linkOf(b)));
  }

  // 등록된 배너가 없으면 예정 세미나와 이벤트성 공지로 대신 채운다
  const out = [];
  const eventCats = ['이벤트', '특강', '세미나'];

  (seminars || []).slice(0, 3).forEach(sm => {
    const meta = [sm.date ? formatDate(sm.date) : '', sm.time || ''].filter(Boolean).join(' · ');
    out.push({
      title: sm.title || '',
      sub: meta || '자세히 보기',
      badge: '특강·세미나',
      hot: sm.date ? isNew(sm.date, 0) : false,
      imageUrl: sm.imageUrl || '',
      type: 'seminar',
      target: sm.id
    });
  });

  (posts || [])
    .filter(pt => eventCats.includes(pt.category))
    .slice(0, 3)
    .forEach(pt => {
      out.push({
        title: pt.title || '',
        sub: formatDate(pt.date),
        badge: pt.category || '이벤트',
        hot: isNew(pt.date),
        imageUrl: pt.imageUrl || '',
        type: 'post',
        target: pt.id
      });
    });

  return out.slice(0, 5);
}

function openBannerTarget(type, target) {
  if (type === 'post') openPost(target);
  else if (type === 'seminar') navigate('seminar-detail', { id: target });
  else if (type === 'link' && target) openExternalBrowser(target);
  else navigate('posts');
}

const BANNER_MS = 5000;      // 한 장이 머무는 시간
const BANNER_SLIDE_MS = 560; // 옆으로 미끄러지는 시간
const BANNER_DRAG_MIN = 44;  // 넘길지 되돌릴지 가르는 드래그 거리(px)

function renderBanners(items) {
  const wrap = document.getElementById('banner-wrap');
  const view = document.getElementById('banner-viewport');
  const track = document.getElementById('banner-track');
  const dots = document.getElementById('banner-dots');
  const counter = document.getElementById('banner-counter');
  if (!wrap || !track || !view) return;

  stopBannerAuto();

  if (!items || items.length === 0) {
    wrap.style.display = 'none';
    return;
  }

  const slideHtml = (b) => {
    const url = b.imageUrl ? escapeHtml(b.imageUrl) : '';
    // 같은 이미지를 배경(흐림)과 썸네일(원본 비율)로 두 번 쓴다
    const bg = url ? `<img class="banner-bg" src="${url}" alt="" loading="lazy" draggable="false">` : '';
    const thumb = url
      ? `<div class="banner-thumb"><img src="${url}" alt="" loading="lazy" draggable="false"></div>`
      : '';
    return `
      <div class="banner-slide ${url ? '' : 'no-img'}" role="button" tabindex="0" data-type="${escapeHtml(b.type)}" data-target="${escapeHtml(b.target)}">
        ${bg}
        <div class="banner-body">
          <span class="banner-badge ${b.hot ? 'hot' : ''}">${escapeHtml(b.badge)}</span>
          <div class="banner-title">${escapeHtml(b.title)}</div>
          ${b.sub ? `<div class="banner-sub">${escapeHtml(b.sub)}</div>` : ''}
        </div>
        ${thumb}
      </div>
    `;
  };

  const multi = items.length > 1;

  // 마지막 장 다음에 첫 장 사본을 붙여 두면, 되감지 않고 계속 왼쪽으로 흐른다
  track.innerHTML = items.map(slideHtml).join('') + (multi ? slideHtml(items[0]) : '');
  wrap.style.setProperty('--banner-dur', BANNER_MS + 'ms');

  dots.innerHTML = multi
    ? items.map((_, i) =>
        `<span class="banner-dot${i === 0 ? ' active' : ''}" role="button" tabindex="0" aria-label="${i + 1}번째 배너" onclick="goBanner(${i})"><span class="banner-dot-fill"></span></span>`
      ).join('')
    : '';
  dots.style.display = multi ? 'flex' : 'none';
  counter.style.display = multi ? 'block' : 'none';

  state.bannerCount = items.length;
  state.bannerIndex = 0;
  state.bannerBusy = false;
  wrap.style.display = 'block';
  setBannerTransform(0, false);
  setBannerIndicator(0);

  if (!multi) return;

  bindBannerDrag(view, track);
  startBannerAuto();
  fitTextsSoon(track);
}

// 트랙을 통째로 옆으로 밀어 i번째 장을 보여준다
function setBannerTransform(i, animate, dragPx) {
  const track = document.getElementById('banner-track');
  if (!track) return;
  track.classList.toggle('no-anim', !animate);
  const offset = dragPx ? ` + ${dragPx}px` : '';
  track.style.transform = `translateX(calc(${-i * 100}%${offset}))`;
  if (!animate) void track.offsetWidth; // 되감기 직후 애니메이션이 되살아나도록 강제 리플로우
}

function setBannerIndicator(idx) {
  state.bannerIndex = idx;
  const dots = document.getElementById('banner-dots');
  const counter = document.getElementById('banner-counter');
  const real = state.bannerCount ? ((idx % state.bannerCount) + state.bannerCount) % state.bannerCount : 0;

  if (dots) {
    [...dots.children].forEach((d, i) => {
      const on = i === real;
      d.classList.toggle('active', on);
      // 차오르는 막대를 매번 처음부터 다시 시작시킨다
      const fill = d.firstElementChild;
      if (fill && on) {
        fill.style.animation = 'none';
        void fill.offsetWidth;
        fill.style.animation = '';
      }
    });
  }
  if (counter && state.bannerCount) counter.textContent = `${real + 1} / ${state.bannerCount}`;
}

// idx는 사본(=bannerCount)까지 허용한다
function goBanner(idx, fromAuto) {
  const n = state.bannerCount;
  if (!n || state.bannerBusy) return;

  let target = idx;
  if (target < 0) target = 0;
  if (target > n) target = n;

  state.bannerBusy = true;
  setBannerTransform(target, true);
  setBannerIndicator(target);

  setTimeout(() => {
    // 사본에 도착했으면 애니메이션 없이 첫 장으로 갈아끼운다
    if (target === n) {
      setBannerTransform(0, false);
      state.bannerIndex = 0;
    }
    state.bannerBusy = false;
  }, BANNER_SLIDE_MS + 20);

  if (!fromAuto) startBannerAuto();
}

function startBannerAuto() {
  stopBannerAuto();
  const wrap = document.getElementById('banner-wrap');
  if (wrap) wrap.classList.remove('paused');
  if (state.bannerCount < 2) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  state.bannerTimer = setInterval(() => {
    if (state.currentPage !== 'home' || document.hidden) return;
    goBanner(state.bannerIndex + 1, true);
  }, BANNER_MS);
}

function stopBannerAuto() {
  if (state.bannerTimer) { clearInterval(state.bannerTimer); state.bannerTimer = null; }
}

function pauseBannerAuto() {
  stopBannerAuto();
  const wrap = document.getElementById('banner-wrap');
  if (wrap) wrap.classList.add('paused');
}

// 손가락으로 미는 동안 트랙이 손끝을 따라오게 한다
function bindBannerDrag(view, track) {
  let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horizontal = false, swiped = false;

  const down = (e) => {
    if (state.bannerBusy) return;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    dx = 0; dragging = true; decided = false; horizontal = false; swiped = false;
    pauseBannerAuto();
  };

  const move = (e) => {
    if (!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const mx = pt.clientX - startX;
    const my = pt.clientY - startY;

    // 세로로 긋는 동작이면 페이지 스크롤에 양보한다
    if (!decided) {
      if (Math.abs(mx) < 6 && Math.abs(my) < 6) return;
      horizontal = Math.abs(mx) > Math.abs(my);
      decided = true;
      if (!horizontal) { dragging = false; startBannerAuto(); return; }
      view.classList.add('dragging');
    }
    dx = mx;
    // 양 끝에서는 저항을 줘서 끝에 닿았음을 손에 알린다
    if ((state.bannerIndex === 0 && dx > 0) || (state.bannerIndex >= state.bannerCount && dx < 0)) dx *= 0.35;
    setBannerTransform(state.bannerIndex, false, dx);
    if (e.cancelable) e.preventDefault();
  };

  const up = () => {
    if (!dragging) return;
    dragging = false;
    view.classList.remove('dragging');
    if (!horizontal) { startBannerAuto(); return; }

    if (Math.abs(dx) >= BANNER_DRAG_MIN) {
      goBanner(state.bannerIndex + (dx < 0 ? 1 : -1));
    } else {
      setBannerTransform(state.bannerIndex, true);
      setBannerIndicator(state.bannerIndex);
      startBannerAuto();
    }
    // 조금이라도 밀었다면 뒤이어 오는 click은 배너 열기로 치지 않는다
    swiped = Math.abs(dx) > 6;
    dx = 0;
  };

  view.addEventListener('touchstart', down, { passive: true });
  view.addEventListener('touchmove', move, { passive: false });
  view.addEventListener('touchend', up);
  view.addEventListener('touchcancel', up);
  view.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);

  // 밀고 난 직후의 클릭은 배너 열기로 치지 않는다
  track.addEventListener('click', (e) => {
    const slide = e.target.closest('.banner-slide');
    if (!slide) return;
    if (swiped) { swiped = false; return; }
    openBannerTarget(slide.dataset.type, slide.dataset.target);
  });

  // 다른 탭에 가 있는 동안에는 차오름을 멈춘다
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseBannerAuto();
    else if (state.currentPage === 'home' && state.bannerCount > 1) startBannerAuto();
  });
}
